<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

  <title>대전 실시간 버스 위치 관제 | 대전 시내버스 실시간 노선 지도</title>
  <meta name="description" content="대전광역시 전 지역 시내버스 실시간 위치 및 도착 예정 시간 지도. 급행, 간선, 지선 버스 상·하행 분리 및 정류소별 실시간 도착 안내.">
  <meta name="keywords" content="대전 버스 실시간, 대전 시내버스 위치, 대전 버스 도착시간, 대전 급행버스, 605번 버스, 급행1번, 703번, 대전 대중교통 지도">
  <link rel="canonical" href="https://daejeon-transit-api.vercel.app/" />
  <meta name="geo.region" content="KR-30" />
  <meta name="geo.placename" content="Daejeon" />

  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Malgun Gothic", sans-serif; background: #fff; }
    #map { width: 100%; height: 100%; }

    /* 상단 슬림 관제 패널 */
    .top-panel {
      position: absolute;
      top: 12px;
      left: 12px;
      z-index: 1000;
      width: calc(100% - 24px);
      max-width: 320px;
    }

    .panel-card {
      background: rgba(255, 255, 255, 0.96);
      padding: 12px 14px;
      border-radius: 12px;
      box-shadow: 0 4px 18px rgba(0,0,0,0.16);
      backdrop-filter: blur(8px);
    }

    .panel-header-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
    }
    .panel-title { font-size: 15px; font-weight: 800; color: #111; }
    .countdown-tag {
      font-size: 11px;
      font-weight: 700;
      color: #0ca678;
      background: #e6fcf5;
      padding: 3px 7px;
      border-radius: 12px;
    }

    .vehicle-count { font-size: 12px; color: #495057; font-weight: 600; margin-bottom: 8px; }

    /* 드롭다운 버튼 */
    .dropdown-btn {
      width: 100%;
      padding: 8px 12px;
      background: #f1f3f5;
      border: 1px solid #ced4da;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 700;
      color: #333;
      text-align: left;
      cursor: pointer;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .dropdown-btn:after {
      content: '▼';
      font-size: 10px;
      color: #666;
    }

    /* 드롭다운으로 펼쳐지는 노선 체크박스 목록 */
    .dropdown-content {
      display: none;
      background: #fff;
      border: 1px solid #dee2e6;
      border-radius: 8px;
      box-shadow: 0 6px 16px rgba(0,0,0,0.15);
      max-height: 220px;
      overflow-y: auto;
      margin-top: 6px;
      padding: 6px;
      flex-direction: column;
      gap: 4px;
    }
    .dropdown-content.show { display: flex; }

    .route-item {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 6px 8px;
      border-radius: 6px;
      font-size: 12px;
      cursor: pointer;
      user-select: none;
    }
    .route-item:hover { background: #f1f3f5; }
    .route-item input { accent-color: #1a73e8; cursor: pointer; }
    .route-label-badge {
      font-weight: bold;
      color: #fff;
      padding: 2px 6px;
      border-radius: 4px;
      font-size: 11px;
    }

    /* 왼쪽 아래 단일 방향 안내 범례 (모바일 방해 최소화) */
    .bottom-legend {
      position: absolute;
      bottom: 16px;
      left: 12px;
      z-index: 1000;
      background: rgba(255, 255, 255, 0.92);
      padding: 8px 12px;
      border-radius: 8px;
      box-shadow: 0 3px 12px rgba(0,0,0,0.15);
      backdrop-filter: blur(4px);
      font-size: 11px;
      color: #333;
      display: flex;
      flex-direction: column;
      gap: 5px;
    }
    .legend-line-row { display: flex; align-items: center; gap: 6px; }
    .legend-bar-solid { width: 16px; height: 4px; background: #1a73e8; border-radius: 2px; }
    .legend-bar-dash { width: 16px; height: 0; border-top: 3px dashed #00acc1; }

    /* 소형화된 버스 마커 (아이콘 안에 숫자만 표기) */
    .mini-bus-icon {
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      font-weight: 800;
      font-size: 11px;
      border: 2px solid #ffffff;
      box-shadow: 0 3px 8px rgba(0,0,0,0.4);
      white-space: nowrap;
      cursor: pointer;
      user-select: none;
      transform: translate(-50%, -50%);
    }

    /* 종류별 형태: 급행(각진 사각/다이아), 간선(원형), 지선(타원) */
    .shape-express {
      width: 32px;
      height: 24px;
      border-radius: 5px;
    }
    .shape-trunk {
      width: 28px;
      height: 28px;
      border-radius: 50%;
    }
    .shape-branch {
      padding: 2px 8px;
      height: 24px;
      border-radius: 12px;
    }

    /* 정류장 핀 */
    .station-pin {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      border: 1.5px solid #fff;
      box-shadow: 0 1px 4px rgba(0,0,0,0.35);
      cursor: pointer;
      transform: translate(-50%, -50%);
    }

    /* 도착정보 팝업 */
    .arr-table { width: 100%; border-collapse: collapse; margin-top: 6px; font-size: 11px; }
    .arr-table th, .arr-table td { padding: 4px 2px; text-align: left; border-bottom: 1px solid #eee; }
    .arr-time { color: #d9251b; font-weight: bold; }
  </style>
</head>
<body>

  <!-- 좌측 상단 컨트롤러 (드롭다운 체크박스) -->
  <div class="top-panel">
    <div class="panel-card">
      <div class="panel-header-row">
        <div class="panel-title">대전 실시간 버스 관제</div>
        <div class="countdown-tag" id="countdownLabel">● 15초 후 갱신</div>
      </div>
      <div class="vehicle-count" id="vehicleCountLabel">운행 차량: 확인 중...</div>

      <button class="dropdown-btn" id="dropdownToggleBtn" onclick="toggleDropdown()">
        <span id="selectedRouteSummary">관제 노선 선택 (605)</span>
      </button>

      <div class="dropdown-content" id="dropdownRouteList">
        <!-- 노선 체크박스 목록 주입 -->
      </div>
    </div>
  </div>

  <!-- 왼쪽 아래 단일 방향 안내 범례 -->
  <div class="bottom-legend">
    <div class="legend-line-row">
      <div class="legend-bar-solid"></div>
      <span><b>상행선</b> (실선 · 진한 색)</span>
    </div>
    <div class="legend-line-row">
      <div class="legend-bar-dash"></div>
      <span><b>하행선</b> (점선 · 밝은 색)</span>
    </div>
    <div style="color: #666; font-size: 10px; margin-top: 2px;">
      * 정류소 핀 클릭 시 도착 시간 표출
    </div>
  </div>

  <div id="map"></div>

  <script>
    // 확대/축소 버튼을 오른쪽 아래(bottomright)로 배치하여 겹침 차단
    const map = L.map('map', { zoomControl: false }).setView([36.3504, 127.3845], 12);
    L.control.zoom({ position: 'bottomright' }).addTo(map);

    L.tileLayer('https://xdworld.vworld.kr/2d/Base/service/{z}/{x}/{y}.png', {
      attribution: '&copy; VWorld',
      maxZoom: 19
    }).addTo(map);

    const lineGroup = L.layerGroup().addTo(map);
    const stationGroup = L.layerGroup().addTo(map);
    const busGroup = L.layerGroup().addTo(map);

    // 대전 주요 공식 노선 풀
    const OFFICIAL_ROUTES = [
      { id: '30300072', name: '605', type: 'trunk', origin: '대전대동문', dest: '갈마아파트' },
      { id: '30300001', name: '1', type: 'express', origin: '원내동', dest: '신안동' },
      { id: '30300002', name: '2', type: 'express', origin: '봉산동', dest: '옥계동' },
      { id: '30300003', name: '3', type: 'express', origin: '원내동', dest: '정부청사' },
      { id: '30300083', name: '703', type: 'trunk', origin: '신탄진', dest: '정림동' },
      { id: '30300057', name: '213', type: 'branch', origin: '원내동', dest: '대한통운' },
      { id: '30300037', name: '102', type: 'trunk', origin: '수통골', dest: '대전역' },
      { id: '30300040', name: '105', type: 'trunk', origin: '충대농대', dest: '판암지구' },
      { id: '30300041', name: '106', type: 'trunk', origin: '목원대', dest: '비래동' },
      { id: '30300043', name: '108', type: 'trunk', origin: '충남대', dest: '낭월동' },
      { id: '30300052', name: '201', type: 'trunk', origin: '원내동', dest: '대전역동광장' },
      { id: '30300067', name: '301', type: 'trunk', origin: '봉산동', dest: '오월드' },
      { id: '30300070', name: '311', type: 'trunk', origin: '신대공영', dest: '오월드' },
      { id: '30300076', name: '606', type: 'trunk', origin: '판암지구', dest: '충남대' },
      { id: '30300084', name: '704', type: 'trunk', origin: '원내동', dest: '보령해양' },
      { id: '30300094', name: '802', type: 'trunk', origin: '봉산동', dest: '산성동' },
      { id: '30300062', name: '216', type: 'branch', origin: '원내동', dest: '시청' },
      { id: '30300078', name: '613', type: 'branch', origin: '비래동', dest: '갈마아파트' },
      { id: '30300104', name: '911', type: 'branch', origin: '충남대', dest: 'DCC' }
    ];

    const activeRouteIds = new Set(['30300072']); // 기본 605번 선택
    const stationCache = {};
    const routeLineSegments = {};
    const lastBusPositions = {};
    let countdown = 15;

    // 노선 번호별 고유 색상 생성기
    function getRouteColor(name, type, isDown = false) {
      if (type === 'express') {
        if (name === '1' || name === '급행1') return isDown ? '#ff6b6b' : '#c92a2a';
        if (name === '2' || name === '급행2') return isDown ? '#ffa94d' : '#d9480f';
        return isDown ? '#f06595' : '#a61e4d';
      }
      let hash = 0;
      for (let i = 0; i < name.length; i++) hash = name.charCodeAt(i) + ((hash << 5) - hash);
      const hue = Math.abs(hash % 360);
      const sat = type === 'branch' ? 65 : 75;
      const light = isDown ? 62 : 40;
      return `hsl(${hue}, ${sat}%, ${light}%)`;
    }

    // 드롭다운 토글
    function toggleDropdown() {
      const list = document.getElementById('dropdownRouteList');
      list.classList.toggle('show');
    }

    // 노선 UI 렌더링
    function initRouteUI() {
      const container = document.getElementById('dropdownRouteList');
      container.innerHTML = '';

      OFFICIAL_ROUTES.forEach(r => {
        const item = document.createElement('label');
        item.className = 'route-item';

        const typeLabel = r.type === 'express' ? '[급행]' : (r.type === 'branch' ? '[지선]' : '[간선]');
        const color = getRouteColor(r.name, r.type, false);

        item.innerHTML = `
          <input type="checkbox" value="${r.id}" ${activeRouteIds.has(r.id) ? 'checked' : ''} onchange="toggleRoute('${r.id}', this.checked)">
          <span class="route-label-badge" style="background:${color};">${typeLabel} ${r.name}</span>
          <span style="color:#555;">${r.origin} ↔ ${r.dest}</span>
        `;
        container.appendChild(item);
      });
      updateSelectedSummary();
    }

    function toggleRoute(routeId, isChecked) {
      if (isChecked) activeRouteIds.add(routeId);
      else activeRouteIds.delete(routeId);
      updateSelectedSummary();
      refresh(true);
    }

    function updateSelectedSummary() {
      const names = [];
      OFFICIAL_ROUTES.forEach(r => {
        if (activeRouteIds.has(r.id)) {
          const typePrefix = r.type === 'express' ? '급행' : '';
          names.push(`${typePrefix}${r.name}`);
        }
      });
      document.getElementById('selectedRouteSummary').textContent = names.length > 0 
        ? `관제 중: ${names.join(', ')}`
        : '노선을 선택해 주세요';
    }

    // 도로 선분 스냅 (착 달라붙게 보정)
    function snapToPolyline(lat, lng, routeId) {
      const segments = routeLineSegments[routeId];
      if (!segments || segments.length === 0) return [lat, lng];

      let minDist = Infinity;
      let snappedPoint = [lat, lng];

      for (let i = 0; i < segments.length - 1; i++) {
        const p1 = segments[i], p2 = segments[i + 1];
        const x = lng, y = lat;
        const x1 = p1[1], y1 = p1[0];
        const x2 = p2[1], y2 = p2[0];

        const dx = x2 - x1, dy = y2 - y1;
        if (dx === 0 && dy === 0) continue;

        const t = Math.max(0, Math.min(1, ((x - x1) * dx + (y - y1) * dy) / (dx * dx + dy * dy)));
        const projLng = x1 + t * dx;
        const projLat = y1 + t * dy;

        const distSq = (x - projLng) * (x - projLng) + (y - projLat) * (y - projLat);
        if (distSq < minDist) {
          minDist = distSq;
          snappedPoint = [projLat, projLng];
        }
      }
      if (minDist < 0.0000008) return snappedPoint;
      return [lat, lng];
    }

    // 노선선 및 정류장 핀 그리기
    async function drawRoutes() {
      lineGroup.clearLayers();
      stationGroup.clearLayers();
      const bounds = [];

      for (const routeId of activeRouteIds) {
        const cfg = OFFICIAL_ROUTES.find(r => r.id === routeId);
        if (!cfg) continue;

        let stations = stationCache[routeId];
        if (!stations) {
          try {
            const res = await fetch(`/api/bus/stations?routeId=${routeId}`);
            const data = await res.json();
            if (data.status === 'success' && data.stations) {
              stations = data.stations;
              stationCache[routeId] = stations;
            }
          } catch(e) {}
        }

        if (stations && stations.length > 1) {
          const half = Math.floor(stations.length / 2);
          const upSt = stations.slice(0, half + 1);
          const downSt = stations.slice(half);

          const upCoords = upSt.map(s => [s.lat, s.lng]);
          const downCoords = downSt.map(s => [s.lat, s.lng]);

          routeLineSegments[routeId] = [...upCoords, ...downCoords];

          const upColor = getRouteColor(cfg.name, cfg.type, false);
          const downColor = getRouteColor(cfg.name, cfg.type, true);

          // 상행 실선, 하행 점선
          L.polyline(upCoords, { color: upColor, weight: 5, opacity: 0.85, lineJoin: 'round' }).addTo(lineGroup);
          L.polyline(downCoords, { color: downColor, weight: 4, dashArray: '7, 7', opacity: 0.9, lineJoin: 'round' }).addTo(lineGroup);

          const createPin = (s, isUp) => {
            const color = isUp ? upColor : downColor;
            const destTargetName = isUp ? cfg.dest : cfg.origin;

            const icon = L.divIcon({
              className: '',
              html: `<div class="station-pin" style="background:${color};"></div>`,
              iconSize: [10, 10]
            });

            const marker = L.marker([s.lat, s.lng], { icon }).addTo(stationGroup);
            bounds.push([s.lat, s.lng]);

            marker.on('click', async () => {
              marker.bindPopup(`<b>🚏 ${s.stationName}</b><br><span style="color:#666;">도착 정보 조회 중...</span>`).openPopup();
              try {
                const arrRes = await fetch(`/api/bus/arrivals?stopId=${s.stationId}`);
                const arrData = await arrRes.json();
                let html = `<div style="min-width:180px;"><b>🚏 ${s.stationName}</b> (${destTargetName} 방면)<br>`;
                if (arrData.status === 'success' && arrData.arrivals?.length > 0) {
                  html += `<table class="arr-table"><tr><th>노선</th><th>도착 예정</th></tr>`;
                  arrData.arrivals.forEach(a => {
                    html += `<tr><td><b>${a.routeName}</b></td><td class="arr-time">${a.remainMin}분 (${a.remainStop}정거장 전)</td></tr>`;
                  });
                  html += `</table>`;
                } else {
                  html += `<div style="margin-top:6px; color:#888; font-size:11px;">현재 도착 예정 차량 없음</div>`;
                }
                html += `</div>`;
                marker.setPopupContent(html);
              } catch(e) {
                marker.setPopupContent(`<b>${s.stationName}</b><br><span style="color:red;">도착 정보 조회 실패</span>`);
              }
            });
          };

          upSt.forEach(s => createPin(s, true));
          downSt.forEach(s => createPin(s, false));
        }
      }

      return bounds;
    }

    function getDistance(lat1, lon1, lat2, lon2) {
      const R = 6371;
      const dLat = (lat2 - lat1) * Math.PI / 180;
      const dLon = (lon2 - lon1) * Math.PI / 180;
      const a = Math.sin(dLat/2) * Math.sin(dLat/2) +
                Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
                Math.sin(dLon/2) * Math.sin(dLon/2);
      return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
    }

    // 소형화된 버스 마커 (아이콘 안에 숫자만 표기)
    async function updateVehicles() {
      busGroup.clearLayers();
      let totalCount = 0;

      for (const routeId of activeRouteIds) {
        const cfg = OFFICIAL_ROUTES.find(r => r.id === routeId);
        if (!cfg) continue;

        try {
          const res = await fetch(`/api/bus/positions?routeId=${routeId}`);
          const data = await res.json();

          if (data.status === 'success' && data.vehicles) {
            totalCount += data.vehicles.length;
            const stations = stationCache[routeId] || [];
            const originCoord = stations.length > 0 ? [stations[0].lat, stations[0].lng] : [36.335, 127.458];
            const destCoord = stations.length > 1 ? [stations[Math.floor(stations.length/2)].lat, stations[Math.floor(stations.length/2)].lng] : [36.354, 127.375];

            data.vehicles.forEach(bus => {
              const busKey = `${routeId}_${bus.plateNo}`;
              let isUp = true;

              if (lastBusPositions[busKey]) {
                const prev = lastBusPositions[busKey];
                const prevDist = getDistance(prev.lat, prev.lng, destCoord[0], destCoord[1]);
                const currDist = getDistance(bus.lat, bus.lng, destCoord[0], destCoord[1]);

                if (Math.abs(prevDist - currDist) > 0.02) {
                  isUp = currDist < prevDist;
                } else {
                  isUp = bus.stopSeq <= Math.floor(stations.length / 2);
                }
              } else {
                isUp = bus.stopSeq <= Math.floor(stations.length / 2);
              }

              lastBusPositions[busKey] = { lat: bus.lat, lng: bus.lng, isUp };

              const snapped = snapToPolyline(bus.lat, bus.lng, routeId);
              const markerBg = getRouteColor(cfg.name, cfg.type, !isUp);
              const targetDest = isUp ? cfg.dest : cfg.origin;

              // 종류별 콤팩트 모양 클래스
              let shapeClass = 'shape-trunk';
              if (cfg.type === 'express') shapeClass = 'shape-express';
              else if (cfg.type === 'branch') shapeClass = 'shape-branch';

              // 아이콘 안에 버스 번호만 깔끔하게 표기
              const icon = L.divIcon({
                className: '',
                html: `<div class="mini-bus-icon ${shapeClass}" style="background:${markerBg};">${cfg.name}</div>`,
                iconSize: [0, 0]
              });

              L.marker(snapped, { icon })
                .bindPopup(`
                  <div style="font-size:12px; line-height:1.5;">
                    <b style="font-size:13px; color:${markerBg};">${cfg.name}번 버스</b><br>
                    <b>행선지:</b> ${targetDest} 방면 (${isUp ? '상행' : '하행'})<br>
                    <b>차량번호:</b> ${bus.plateNo}<br>
                    <b>현재 위치:</b> ${bus.stopSeq}번째 정류소 통과 중<br>
                    <b>수신:</b> ${new Date(bus.updatedAt).toLocaleTimeString()}
                  </div>
                `)
                .addTo(busGroup);
            });
          }
        } catch(e) {}
      }

      document.getElementById('vehicleCountLabel').textContent = `운행 차량: 총 ${totalCount}대`;
    }

    async function refresh(autoFit = false) {
      const bounds = await drawRoutes();
      await updateVehicles();
      if (autoFit && bounds.length > 0) {
        map.fitBounds(bounds, { padding: [50, 50], maxZoom: 14 });
      }
    }

    // 1초 카운트다운 인터벌
    setInterval(() => {
      countdown--;
      if (countdown <= 0) {
        countdown = 15;
        document.getElementById('countdownLabel').textContent = '● 갱신 중...';
        updateVehicles().then(() => {
          document.getElementById('countdownLabel').textContent = `● 15초 후 갱신`;
        });
      } else {
        document.getElementById('countdownLabel').textContent = `● ${countdown}초 후 갱신`;
      }
    }, 1000);

    // 팝업 외부 터치 시 드롭다운 닫기
    window.addEventListener('click', (e) => {
      const dropdown = document.getElementById('dropdownRouteList');
      const toggleBtn = document.getElementById('dropdownToggleBtn');
      if (!toggleBtn.contains(e.target) && !dropdown.contains(e.target)) {
        dropdown.classList.remove('show');
      }
    });

    initRouteUI();
    refresh(true);
  </script>
</body>
</html>
