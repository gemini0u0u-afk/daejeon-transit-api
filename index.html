<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  
  <title>대전 실시간 버스 위치 관제 | 대전 시내버스 다중 노선 모니터링</title>
  <meta name="description" content="대전광역시 공공데이터 기반 실시간 버스 위치 및 상·하행 노선 궤적 지도. 복수 노선 동시 관제 지원.">
  <meta name="geo.region" content="KR-30" />
  <meta name="geo.placename" content="Daejeon" />

  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body, html { width: 100%; height: 100%; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Malgun Gothic", sans-serif; overflow: hidden; }
    
    #map { width: 100%; height: 100%; }

    /* 대시보드 오버레이 UI */
    .status-panel {
      position: absolute;
      top: 16px;
      left: 16px;
      z-index: 1000;
      background: rgba(255, 255, 255, 0.96);
      padding: 16px 18px;
      border-radius: 12px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.18);
      backdrop-filter: blur(8px);
      width: 320px;
      max-height: 90vh;
      display: flex;
      flex-direction: column;
    }
    .status-panel h1 { font-size: 16px; font-weight: 700; color: #111; margin-bottom: 2px; }
    .status-panel .subtitle { font-size: 11px; color: #666; margin-bottom: 10px; }
    
    .panel-meta {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
      font-size: 12px;
      padding-bottom: 8px;
      border-bottom: 1px solid #eee;
    }
    .badge-sync {
      padding: 2px 7px;
      font-size: 10px;
      font-weight: 600;
      border-radius: 12px;
      background: #e6f4ea;
      color: #137333;
    }

    /* 다중 노선 선택 체크박스 리스트 */
    .route-list-header {
      font-size: 12px;
      font-weight: 700;
      color: #444;
      margin-bottom: 6px;
      display: flex;
      justify-content: space-between;
    }
    .route-list {
      overflow-y: auto;
      max-height: 240px;
      padding-right: 4px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      margin-bottom: 10px;
    }
    .route-item {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 6px 8px;
      border-radius: 6px;
      background: #f8f9fa;
      border: 1px solid #e9ecef;
      font-size: 12px;
      cursor: pointer;
      user-select: none;
    }
    .route-item:hover { background: #eef2f7; }
    .route-item input[type="checkbox"] { cursor: pointer; accent-color: #1a73e8; }
    .route-tag {
      font-size: 10px;
      font-weight: 700;
      padding: 1px 6px;
      border-radius: 10px;
      color: #fff;
    }
    .tag-express { background: #d9251b; }
    .tag-trunk { background: #1a73e8; }
    .tag-branch { background: #28a745; }

    /* 방향 범례 */
    .legend-box {
      font-size: 11px;
      background: #fbfbfb;
      padding: 8px 10px;
      border-radius: 6px;
      border: 1px solid #eee;
    }
    .legend-row { display: flex; align-items: center; gap: 6px; margin-bottom: 4px; }
    .legend-row:last-child { margin-bottom: 0; }
    .legend-line { width: 18px; height: 3px; border-radius: 2px; }
    .legend-line-dashed {
      width: 18px; height: 3px;
      border-top: 3px dashed #00bcd4;
      background: transparent;
    }

    /* 실시간 버스 마커 스타일 */
    .bus-marker {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      color: #fff;
      font-size: 11px;
      font-weight: 700;
      padding: 3px 7px;
      border-radius: 16px;
      box-shadow: 0 3px 8px rgba(0,0,0,0.4);
      border: 2px solid #fff;
      white-space: nowrap;
      cursor: pointer;
      transform: translate(-50%, -50%);
    }
    .bus-dir-badge {
      font-size: 9px;
      padding: 1px 3px;
      border-radius: 4px;
      background: rgba(0, 0, 0, 0.28);
    }

    /* 색상 규격 (상행: 기본 테마색 / 하행: 구분 보조색) */
    .bus-express-up { background: #d9251b; }
    .bus-express-down { background: #ff7043; }
    .bus-trunk-up { background: #1a73e8; }
    .bus-trunk-down { background: #00acc1; }
    .bus-branch-up { background: #2e7d32; }
    .bus-branch-down { background: #7cb342; }
  </style>
</head>
<body>

  <div class="status-panel">
    <h1>대전 버스 실시간 다중 관제</h1>
    <div class="subtitle">정류소 기반 노선 곡선 보정 & 상·하행 분기</div>

    <div class="panel-meta">
      <span id="total-bus-count">총 운행 차량: 0대</span>
      <span class="badge-sync">15초 자동 갱신</span>
    </div>

    <div class="route-list-header">
      <span>관제 노선 선택 (중복 체크)</span>
      <span style="font-size:10px; color:#888;">다중 선택 가능</span>
    </div>

    <div class="route-list" id="route-checkbox-container">
      <!-- 노선 목록 렌더링 영역 -->
    </div>

    <div class="legend-box">
      <div class="legend-row">
        <div class="legend-line" style="background:#1a73e8;"></div>
        <span><b>상행선</b>: 실선 궤적 & 진한 색상 마커 (▲ 상행)</span>
      </div>
      <div class="legend-row">
        <div class="legend-line-dashed"></div>
        <span><b>하행선</b>: 점선 궤적 & 밝은 색상 마커 (▼ 하행)</span>
      </div>
    </div>
  </div>

  <div id="map"></div>

  <script>
    // 1. Leaflet 지도 초기화 (확대/축소 버튼을 우측 상단으로 이동하여 패널 가림 해결)
    const map = L.map('map', { zoomControl: false }).setView([36.3504, 127.3845], 12);
    L.control.zoom({ position: 'topright' }).addTo(map);

    // VWorld 한글 타일 레이어
    L.tileLayer('https://xdworld.vworld.kr/2d/Base/service/{z}/{x}/{y}.png', {
      attribution: '&copy; VWorld 국가공간정보',
      maxZoom: 19
    }).addTo(map);

    const busLayerGroup = L.layerGroup().addTo(map);
    const lineLayerGroup = L.layerGroup().addTo(map);

    // 2. 대전 주요 버스 노선 풀(Pool)
    const ROUTE_LIST = [
      { id: '30300075', name: '605', type: 'trunk', desc: '대전대 ↔ 갈마아파트' },
      { id: '30300001', name: '급행1', type: 'express', desc: '원내동 ↔ 신탄진' },
      { id: '30300002', name: '급행2', type: 'express', desc: '봉산동 ↔ 옥계동' },
      { id: '30300003', name: '급행3', type: 'express', desc: '원내동 ↔ 정부청사' },
      { id: '30300083', name: '703', type: 'trunk', desc: '신탄진 ↔ 정림동' },
      { id: '30300057', name: '213', type: 'branch', desc: '원내동 ↔ 대한통운' },
      { id: '30300037', name: '102', type: 'trunk', desc: '수통골 ↔ 대전역' },
      { id: '30300040', name: '105', type: 'trunk', desc: '충대농대 ↔ 판암지구' },
      { id: '30300041', name: '106', type: 'trunk', desc: '목원대 ↔ 비래동' },
      { id: '30300052', name: '201', type: 'trunk', desc: '원내동 ↔ 대전역동광장' },
      { id: '30300067', name: '301', type: 'trunk', desc: '봉산동 ↔ 오월드' },
      { id: '30300070', name: '311', type: 'trunk', desc: '신대공영 ↔ 오월드' },
      { id: '30300084', name: '704', type: 'trunk', desc: '원내동 ↔ 보령해양' }
    ];

    // 현재 선택된 노선 ID 세트
    const activeRouteIds = new Set(['30300075']); // 초기 선택: 605번
    const routeStationsCache = {}; // 노선별 정류장 데이터 캐시

    // 3. UI 체크박스 생성
    function initRouteUI() {
      const container = document.getElementById('route-checkbox-container');
      container.innerHTML = '';

      ROUTE_LIST.forEach(route => {
        const item = document.createElement('label');
        item.className = 'route-item';

        const tagClass = route.type === 'express' ? 'tag-express' : (route.type === 'branch' ? 'tag-branch' : 'tag-trunk');
        const checked = activeRouteIds.has(route.id) ? 'checked' : '';

        item.innerHTML = `
          <input type="checkbox" value="${route.id}" ${checked} onchange="toggleRoute('${route.id}', this.checked)">
          <span class="route-tag ${tagClass}">${route.name}</span>
          <span style="color:#333; font-weight:600;">${route.desc}</span>
        `;
        container.appendChild(item);
      });
    }

    function toggleRoute(routeId, isChecked) {
      if (isChecked) {
        activeRouteIds.add(routeId);
      } else {
        activeRouteIds.delete(routeId);
      }
      refreshAll();
    }

    // 4. Catmull-Rom 스플라인을 활용한 도로 곡선 보정 함수 (직선 꺾임 완화)
    function smoothPoints(points, tension = 0.5, segments = 5) {
      if (points.length < 3) return points;
      const smoothed = [];

      for (let i = 0; i < points.length - 1; i++) {
        const p0 = i > 0 ? points[i - 1] : points[i];
        const p1 = points[i];
        const p2 = points[i + 1];
        const p3 = i != points.length - 2 ? points[i + 2] : p2;

        for (let t = 0; t < segments; t++) {
          const s = t / segments;
          const s2 = s * s;
          const s3 = s * s2;

          const lat = 0.5 * (
            (2 * p1[0]) +
            (-p0[0] + p2[0]) * s +
            (2 * p0[0] - 5 * p1[0] + 4 * p2[0] - p3[0]) * s2 +
            (-p0[0] + 3 * p1[0] - 3 * p2[0] + p3[0]) * s3
          );

          const lng = 0.5 * (
            (2 * p1[1]) +
            (-p0[1] + p2[1]) * s +
            (2 * p0[1] - 5 * p1[1] + 4 * p2[1] - p3[1]) * s2 +
            (-p0[1] + 3 * p1[1] - 3 * p2[1] + p3[1]) * s3
          );

          smoothed.push([lat, lng]);
        }
      }
      smoothed.push(points[points.length - 1]);
      return smoothed;
    }

    // 5. 정류소 기반 상/하행 노선선 렌더링
    async function fetchAndDrawRouteTracks() {
      lineLayerGroup.clearLayers();
      const allBounds = [];

      for (const routeId of activeRouteIds) {
        const routeMeta = ROUTE_LIST.find(r => r.id === routeId);
        if (!routeMeta) continue;

        let stations = routeStationsCache[routeId];
        if (!stations) {
          try {
            const res = await fetch(`/api/bus/stations?routeId=${routeId}`);
            const data = await res.json();
            if (data.status === 'success' && data.stations) {
              stations = data.stations;
              routeStationsCache[routeId] = stations;
            }
          } catch (e) {
            console.error(`노선 ${routeId} 수신 실패:`, e);
          }
        }

        if (stations && stations.length > 1) {
          // 중간 회차 지점을 기준으로 상행(기점->회차)과 하행(회차->종점) 분리
          const midIdx = Math.floor(stations.length / 2);
          const upPoints = stations.slice(0, midIdx + 1).map(s => [s.lat, s.lng]);
          const downPoints = stations.slice(midIdx).map(s => [s.lat, s.lng]);

          // 곡선 보정 적용
          const smoothUp = smoothPoints(upPoints, 0.4, 4);
          const smoothDown = smoothPoints(downPoints, 0.4, 4);

          const baseColor = routeMeta.type === 'express' ? '#d9251b' : (routeMeta.type === 'branch' ? '#2e7d32' : '#1a73e8');
          const downColor = routeMeta.type === 'express' ? '#ff7043' : (routeMeta.type === 'branch' ? '#7cb342' : '#00acc1');

          // 상행선 (실선)
          L.polyline(smoothUp, {
            color: baseColor,
            weight: 5,
            opacity: 0.8,
            lineJoin: 'round'
          }).addTo(lineLayerGroup);

          // 하행선 (점선)
          L.polyline(smoothDown, {
            color: downColor,
            weight: 4,
            dashArray: '8, 8',
            opacity: 0.85,
            lineJoin: 'round'
          }).addTo(lineLayerGroup);

          stations.forEach(s => allBounds.push([s.lat, s.lng]));
        }
      }

      return allBounds;
    }

    // 6. 실시간 다중 버스 위치 요청 및 상·하행 분기 마커 표출
    async function updateAllVehicles() {
      busLayerGroup.clearLayers();
      let totalVehicles = 0;

      for (const routeId of activeRouteIds) {
        const routeMeta = ROUTE_LIST.find(r => r.id === routeId);
        if (!routeMeta) continue;

        try {
          const res = await fetch(`/api/bus/positions?routeId=${routeId}`);
          const data = await res.json();

          if (data.status === 'success' && data.vehicles) {
            totalVehicles += data.vehicles.length;
            const stations = routeStationsCache[routeId] || [];
            const midSeq = stations.length > 0 ? (stations[Math.floor(stations.length / 2)].seq || Math.floor(stations.length / 2)) : 50;

            data.vehicles.forEach(bus => {
              // 실제 정류소 순번 기반 상행/하행 명확 판별
              const isUp = bus.stopSeq <= midSeq;
              const dirLabel = isUp ? '▲ 상행' : '▼ 하행';

              let markerClass = '';
              if (routeMeta.type === 'express') {
                markerClass = isUp ? 'bus-express-up' : 'bus-express-down';
              } else if (routeMeta.type === 'branch') {
                markerClass = isUp ? 'bus-branch-up' : 'bus-branch-down';
              } else {
                markerClass = isUp ? 'bus-trunk-up' : 'bus-trunk-down';
              }

              const busIcon = L.divIcon({
                className: 'custom-bus-div',
                html: `
                  <div class="bus-marker ${markerClass}">
                    <span>🚌 ${routeMeta.name}</span>
                    <span class="bus-dir-badge">${dirLabel}</span>
                  </div>
                `,
                iconSize: [0, 0]
              });

              const marker = L.marker([bus.lat, bus.lng], { icon: busIcon })
                .bindPopup(`
                  <div style="font-size:12px; line-height:1.6;">
                    <b style="font-size:14px; color:#1a73e8;">${routeMeta.name}번 버스 (${dirLabel})</b><br>
                    <b>노선 경로:</b> ${routeMeta.desc}<br>
                    <b>차량번호:</b> ${bus.plateNo}<br>
                    <b>경유 순번:</b> ${bus.stopSeq}번째 정류소<br>
                    <b>수신 시각:</b> ${new Date(bus.updatedAt).toLocaleTimeString()}
                  </div>
                `);

              busLayerGroup.addLayer(marker);
            });
          }
        } catch (e) {
          console.error(`차량 수신 에러 (${routeId}):`, e);
        }
      }

      document.getElementById('total-bus-count').textContent = `총 운행 차량: ${totalVehicles}대`;
    }

    // 전체 새로고침
    async function refreshAll(fit = false) {
      const bounds = await fetchAndDrawRouteTracks();
      await updateAllVehicles();

      if (fit && bounds.length > 0) {
        map.fitBounds(bounds, { padding: [40, 40], maxZoom: 14 });
      }
    }

    // 초기 구동
    initRouteUI();
    refreshAll(true);
    setInterval(updateAllVehicles, 15000);
  </script>
</body>
</html>
