<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>대전 실시간 버스 관제 시스템</title>
  
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body, html { width: 100%; height: 100%; overflow: hidden; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    #map { width: 100%; height: 100%; }

    .control-panel {
      position: absolute; top: 16px; left: 16px; z-index: 1000;
      background: rgba(255, 255, 255, 0.96); padding: 16px 18px; border-radius: 12px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.18); backdrop-filter: blur(8px);
      width: 320px; max-height: 90vh; display: flex; flex-direction: column;
    }
    .panel-title { font-size: 16px; font-weight: 800; color: #111; margin-bottom: 2px; }
    .panel-desc { font-size: 11px; color: #666; margin-bottom: 10px; }

    .summary-box {
      display: flex; justify-content: space-between; align-items: center;
      background: #f1f3f5; padding: 6px 10px; border-radius: 6px;
      font-size: 12px; font-weight: 600; margin-bottom: 10px;
    }

    .route-list-wrap {
      overflow-y: auto; max-height: 220px; display: flex; flex-direction: column;
      gap: 6px; padding-right: 4px; margin-bottom: 10px;
    }
    .route-item {
      display: flex; align-items: center; gap: 8px; padding: 7px 10px; border-radius: 6px;
      background: #f8f9fa; border: 1px solid #e9ecef; font-size: 12px; cursor: pointer;
    }
    .route-item:hover { background: #e7f5ff; }
    .route-item input { accent-color: #1a73e8; cursor: pointer; }
    .route-tag { padding: 2px 6px; font-size: 10px; font-weight: bold; color: #fff; border-radius: 10px; }

    .legend-box { border-top: 1px solid #eee; padding-top: 8px; font-size: 11px; display: flex; flex-direction: column; gap: 4px; color: #555; }
    .legend-row { display: flex; align-items: center; gap: 8px; }
    .legend-line { width: 18px; height: 4px; border-radius: 2px; }
    .legend-dashed { width: 18px; height: 0; border-top: 3px dashed #00acc1; }

    .station-pin {
      width: 11px; height: 11px; border-radius: 50%; border: 2px solid #fff;
      box-shadow: 0 2px 5px rgba(0,0,0,0.4); cursor: pointer; transform: translate(-50%, -50%);
    }

    .bus-marker {
      display: inline-flex; align-items: center; gap: 4px; color: #fff;
      font-size: 11px; font-weight: 700; padding: 4px 8px; border-radius: 16px;
      box-shadow: 0 3px 8px rgba(0,0,0,0.35); border: 2px solid #fff;
      white-space: nowrap; cursor: pointer; transform: translate(-50%, -50%);
    }
    .bus-dir { font-size: 9px; padding: 1px 4px; border-radius: 3px; background: rgba(0,0,0,0.28); }

    .arr-table { width: 100%; border-collapse: collapse; margin-top: 6px; font-size: 11px; }
    .arr-table th, .arr-table td { padding: 4px 2px; text-align: left; border-bottom: 1px solid #eee; }
    .arr-time { color: #d9251b; font-weight: bold; }
  </style>
</head>
<body>

  <div class="control-panel">
    <div class="panel-title">대전 버스 실시간 관제</div>
    <div class="panel-desc">공공데이터 자동 동기화 & 도로 밀착 보정</div>

    <div class="summary-box">
      <span id="vehicle-count-label">노선 목록 동기화 중...</span>
      <span style="color:#0ca678; font-size:10px;">● 15초 갱신</span>
    </div>

    <div style="font-size:11px; font-weight:bold; color:#444; margin-bottom:4px;">관제 노선 선택 (중복 체크)</div>
    <div class="route-list-wrap" id="routeList"></div>

    <div class="legend-box">
      <div class="legend-row">
        <div class="legend-line" style="background:#1a73e8;"></div>
        <span><b>상행선</b>: 실선 궤적 & 진한 마커 (▲ 종점행)</span>
      </div>
      <div class="legend-row">
        <div class="legend-dashed"></div>
        <span><b>하행선</b>: 점선 궤적 & 밝은 마커 (▼ 기점행)</span>
      </div>
      <div class="legend-row">
        <div class="station-pin" style="background:#495057; width:9px; height:9px; transform:none;"></div>
        <span><b>정류장 핀</b>: 클릭 시 실시간 도착 정보 표출</span>
      </div>
    </div>
  </div>

  <div id="map"></div>

  <script>
    const map = L.map('map', { zoomControl: false }).setView([36.3504, 127.3845], 12);
    L.control.zoom({ position: 'topright' }).addTo(map);

    L.tileLayer('https://xdworld.vworld.kr/2d/Base/service/{z}/{x}/{y}.png', {
      attribution: '&copy; VWorld',
      maxZoom: 19
    }).addTo(map);

    const lineGroup = L.layerGroup().addTo(map);
    const stationGroup = L.layerGroup().addTo(map);
    const busGroup = L.layerGroup().addTo(map);

    // 대전 주요 기본 노선 풀 (자동 검증 백업용)
    let ROUTES = [
      { id: '30300072', name: '605', type: 'trunk', color: '#1a73e8', downColor: '#00acc1', desc: '대전대동문 ↔ 갈마아파트', originName: '대전대동문', destName: '갈마아파트' }
    ];

    const activeRouteIds = new Set(['30300072']);
    const stationCache = {};
    const routeLineSegments = {}; // 도로 스냅용 선분 캐시
    const lastBusPositions = {};

    // 1. 서버에서 공공데이터 정규 노선 전체 목록 가져오기
    async function loadMasterRoutes() {
      try {
        const res = await fetch('/api/bus/routes');
        const data = await res.json();
        if (data.status === 'success' && data.routes?.length > 0) {
          // 관심 노선들(급행1~3, 102, 105, 201, 213, 301, 605, 703 등) 우선 정렬
          const priority = ['605', '급행1', '급행2', '급행3', '703', '213', '102', '105', '201', '301'];
          const matched = [];

          priority.forEach(pName => {
            const found = data.routes.find(r => r.name === pName);
            if (found) {
              matched.push({
                id: found.id,
                name: found.name,
                type: found.type,
                color: found.type === 'express' ? '#d9251b' : (found.type === 'branch' ? '#2b8a3e' : '#1a73e8'),
                downColor: found.type === 'express' ? '#ff7043' : (found.type === 'branch' ? '#74b816' : '#00acc1'),
                desc: found.desc,
                originName: found.origin,
                destName: found.dest
              });
            }
          });

          if (matched.length > 0) ROUTES = matched;
        }
      } catch (e) {
        console.warn('마스터 노선 조회 실패, 기본 노선 사용:', e);
      }
      renderUI();
      refresh(true);
    }

    function renderUI() {
      const container = document.getElementById('routeList');
      container.innerHTML = '';
      ROUTES.forEach(r => {
        const item = document.createElement('label');
        item.className = 'route-item';
        item.innerHTML = `
          <input type="checkbox" value="${r.id}" ${activeRouteIds.has(r.id) ? 'checked' : ''} onchange="toggleRoute('${r.id}', this.checked)">
          <span class="route-tag" style="background:${r.color};">${r.name}</span>
          <span style="font-weight:600; color:#333;">${r.desc}</span>
        `;
        container.appendChild(item);
      });
    }

    function toggleRoute(routeId, isChecked) {
      if (isChecked) activeRouteIds.add(routeId);
      else activeRouteIds.delete(routeId);
      refresh(true);
    }

    // 2. 도로 선분 투영(Snap-to-Road): 버스 GPS를 가장 가까운 도로선 위로 보정
    function snapToPolyline(lat, lng, routeId) {
      const segments = routeLineSegments[routeId];
      if (!segments || segments.length === 0) return [lat, lng];

      let minDist = Infinity;
      let snappedPoint = [lat, lng];

      for (let i = 0; i < segments.length - 1; i++) {
        const p1 = segments[i];
        const p2 = segments[i + 1];

        const x = lng, y = lat;
        const x1 = p1[1], y1 = p1[0];
        const x2 = p2[1], y2 = p2[0];

        const dx = x2 - x1, dy = y2 - y1;
        if (dx === 0 && dy === 0) continue;

        const t = Math.max(0, Math.min(1, ((x - x1) * dx + (y - y1) * dy) / (dx * dx + dy * dy)));
        const projLng = x1 + t * dx;
        const projLat = y1 + t * dy;

        const distSq = (x - projLng) * (x - projLng) + (y - projLat) * (y - projLat);
        if (distSq < minDist) {
          minDist = distSq;
          snappedPoint = [projLat, projLng];
        }
      }

      // 오차가 80m 이내일 때만 도로에 스냅 (터무니없이 멀리 있는 경우 왜곡 방지)
      if (minDist < 0.0000008) return snappedPoint;
      return [lat, lng];
    }

    // 3. 노선 및 정류소 그리기
    async function drawRoutes() {
      lineGroup.clearLayers();
      stationGroup.clearLayers();
      const bounds = [];

      for (const routeId of activeRouteIds) {
        const cfg = ROUTES.find(r => r.id === routeId);
        if (!cfg) continue;

        let stations = stationCache[routeId];
        if (!stations) {
          try {
            const res = await fetch(`/api/bus/stations?routeId=${routeId}`);
            const data = await res.json();
            if (data.status === 'success' && data.stations) {
              stations = data.stations;
              stationCache[routeId] = stations;
            }
          } catch(e) {}
        }

        if (stations && stations.length > 1) {
          const half = Math.floor(stations.length / 2);
          const upSt = stations.slice(0, half + 1);
          const downSt = stations.slice(half);

          const upCoords = upSt.map(s => [s.lat, s.lng]);
          const downCoords = downSt.map(s => [s.lat, s.lng]);

          // 스냅용 도로선 저장
          routeLineSegments[routeId] = [...upCoords, ...downCoords];

          L.polyline(upCoords, { color: cfg.color, weight: 5, opacity: 0.85, lineJoin: 'round' }).addTo(lineGroup);
          L.polyline(downCoords, { color: cfg.downColor, weight: 4, dashArray: '7, 7', opacity: 0.9, lineJoin: 'round' }).addTo(lineGroup);

          const createPin = (s, isUp) => {
            const color = isUp ? cfg.color : cfg.downColor;
            const icon = L.divIcon({
              className: '',
              html: `<div class="station-pin" style="background:${color};"></div>`,
              iconSize: [11, 11]
            });

            const marker = L.marker([s.lat, s.lng], { icon }).addTo(stationGroup);
            bounds.push([s.lat, s.lng]);

            marker.on('click', async () => {
              marker.bindPopup(`<b>🚏 ${s.stationName}</b><br><span style="color:#666;">도착 정보 조회 중...</span>`).openPopup();
              try {
                const arrRes = await fetch(`/api/bus/arrivals?stopId=${s.stationId}`);
                const arrData = await arrRes.json();
                let html = `<div style="min-width:180px;"><b>🚏 ${s.stationName}</b> (${isUp ? '상행' : '하행'})<br>`;
                if (arrData.status === 'success' && arrData.arrivals?.length > 0) {
                  html += `<table class="arr-table"><tr><th>노선</th><th>도착 예정</th></tr>`;
                  arrData.arrivals.forEach(a => {
                    html += `<tr><td><b>${a.routeName}</b></td><td class="arr-time">${a.remainMin}분 (${a.remainStop}정거장 전)</td></tr>`;
                  });
                  html += `</table>`;
                } else {
                  html += `<div style="margin-top:6px; color:#888; font-size:11px;">현재 도착 예정 차량 없음</div>`;
                }
                html += `</div>`;
                marker.setPopupContent(html);
              } catch(e) {
                marker.setPopupContent(`<b>${s.stationName}</b><br><span style="color:red;">도착 정보 조회 실패</span>`);
              }
            });
          };

          upSt.forEach(s => createPin(s, true));
          downSt.forEach(s => createPin(s, false));
        }
      }

      return bounds;
    }

    function getDistance(lat1, lon1, lat2, lon2) {
      const R = 6371;
      const dLat = (lat2 - lat1) * Math.PI / 180;
      const dLon = (lon2 - lon1) * Math.PI / 180;
      const a = Math.sin(dLat/2) * Math.sin(dLat/2) +
                Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
                Math.sin(dLon/2) * Math.sin(dLon/2);
      return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
    }

    // 4. 실시간 버스 위치 및 도로 밀착 보정 표출
    async function updateVehicles() {
      busGroup.clearLayers();
      let count = 0;

      for (const routeId of activeRouteIds) {
        const cfg = ROUTES.find(r => r.id === routeId);
        if (!cfg) continue;

        try {
          const res = await fetch(`/api/bus/positions?routeId=${routeId}`);
          const data = await res.json();

          if (data.status === 'success' && data.vehicles) {
            count += data.vehicles.length;
            const stations = stationCache[routeId] || [];
            const originCoord = stations.length > 0 ? [stations[0].lat, stations[0].lng] : [36.335, 127.458];
            const destCoord = stations.length > 1 ? [stations[Math.floor(stations.length/2)].lat, stations[Math.floor(stations.length/2)].lng] : [36.354, 127.375];

            data.vehicles.forEach(bus => {
              const busKey = `${routeId}_${bus.plateNo}`;
              let isUp = true;

              if (lastBusPositions[busKey]) {
                const prev = lastBusPositions[busKey];
                const prevDistToDest = getDistance(prev.lat, prev.lng, destCoord[0], destCoord[1]);
                const currDistToDest = getDistance(bus.lat, bus.lng, destCoord[0], destCoord[1]);

                if (Math.abs(prevDistToDest - currDistToDest) > 0.02) {
                  isUp = currDistToDest < prevDistToDest;
                } else {
                  isUp = bus.stopSeq <= Math.floor(stations.length / 2);
                }
              } else {
                isUp = bus.stopSeq <= Math.floor(stations.length / 2);
              }

              lastBusPositions[busKey] = { lat: bus.lat, lng: bus.lng, isUp };

              // 도로 위 밀착 보정 좌표 계산
              const snapped = snapToPolyline(bus.lat, bus.lng, routeId);

              const dirLabel = isUp ? `▲ ${cfg.destName || '종점'}행` : `▼ ${cfg.originName || '기점'}행`;
              const color = isUp ? cfg.color : cfg.downColor;

              const icon = L.divIcon({
                className: '',
                html: `
                  <div class="bus-marker" style="background:${color};">
                    <span>🚌 ${cfg.name}</span>
                    <span class="bus-dir">${dirLabel}</span>
                  </div>
                `,
                iconSize: [0, 0]
              });

              L.marker(snapped, { icon })
                .bindPopup(`
                  <div style="font-size:12px; line-height:1.5;">
                    <b style="font-size:13px; color:${cfg.color};">${cfg.name}번 (${dirLabel})</b><br>
                    <b>노선:</b> ${cfg.desc}<br>
                    <b>차량번호:</b> ${bus.plateNo}<br>
                    <b>현재 통과 순번:</b> ${bus.stopSeq}번째 정류소<br>
                    <b>갱신:</b> ${new Date(bus.updatedAt).toLocaleTimeString()}
                  </div>
                `)
                .addTo(busGroup);
            });
          }
        } catch(e) {}
      }

      document.getElementById('vehicle-count-label').textContent = `운행 차량: 총 ${count}대`;
    }

    async function refresh(autoFit = false) {
      const bounds = await drawRoutes();
      await updateVehicles();
      if (autoFit && bounds.length > 0) {
        map.fitBounds(bounds, { padding: [50, 50], maxZoom: 14 });
      }
    }

    loadMasterRoutes();
    setInterval(updateVehicles, 15000);
  </script>
</body>
</html>
