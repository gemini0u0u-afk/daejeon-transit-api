<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>대전 실시간 버스 관제 & OSRM 도로 밀착 노선도</title>
  
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body, html { width: 100%; height: 100%; overflow: hidden; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    #map { width: 100%; height: 100%; }

    .control-panel {
      position: absolute;
      top: 16px;
      left: 16px;
      z-index: 1000;
      background: rgba(255, 255, 255, 0.96);
      padding: 16px 18px;
      border-radius: 12px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.18);
      backdrop-filter: blur(8px);
      width: 320px;
      max-height: 90vh;
      display: flex;
      flex-direction: column;
    }
    .panel-title { font-size: 16px; font-weight: 800; color: #111; margin-bottom: 2px; }
    .panel-desc { font-size: 11px; color: #666; margin-bottom: 10px; }

    .summary-box {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #f1f3f5;
      padding: 6px 10px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 600;
      margin-bottom: 10px;
    }

    .route-list-wrap {
      overflow-y: auto;
      max-height: 200px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      padding-right: 4px;
      margin-bottom: 10px;
    }
    .route-item {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 7px 10px;
      border-radius: 6px;
      background: #f8f9fa;
      border: 1px solid #e9ecef;
      font-size: 12px;
      cursor: pointer;
      user-select: none;
    }
    .route-item:hover { background: #e7f5ff; }
    .route-item input { accent-color: #1a73e8; cursor: pointer; }
    .route-tag {
      padding: 2px 6px;
      font-size: 10px;
      font-weight: bold;
      color: #fff;
      border-radius: 10px;
    }

    .legend-box {
      border-top: 1px solid #eee;
      padding-top: 8px;
      font-size: 11px;
      display: flex;
      flex-direction: column;
      gap: 4px;
      color: #555;
    }
    .legend-row { display: flex; align-items: center; gap: 8px; }
    .legend-line { width: 18px; height: 4px; border-radius: 2px; }
    .legend-dashed { width: 18px; height: 0; border-top: 3px dashed #00acc1; }

    /* 정류장 핀 스타일 */
    .station-pin {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      border: 2px solid #ffffff;
      box-shadow: 0 2px 5px rgba(0,0,0,0.4);
      cursor: pointer;
      transform: translate(-50%, -50%);
    }

    /* 실시간 버스 마커 스타일 */
    .bus-marker {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      color: #fff;
      font-size: 11px;
      font-weight: 700;
      padding: 4px 8px;
      border-radius: 16px;
      box-shadow: 0 3px 8px rgba(0,0,0,0.35);
      border: 2px solid #fff;
      white-space: nowrap;
      cursor: pointer;
      transform: translate(-50%, -50%);
    }
    .bus-dir {
      font-size: 9px;
      padding: 1px 4px;
      border-radius: 3px;
      background: rgba(0,0,0,0.28);
    }

    /* 도착정보 팝업 스타일 */
    .arr-table { width: 100%; border-collapse: collapse; margin-top: 6px; font-size: 11px; }
    .arr-table th, .arr-table td { padding: 4px 2px; text-align: left; border-bottom: 1px solid #eee; }
    .arr-time { color: #d9251b; font-weight: bold; }
  </style>
</head>
<body>

  <div class="control-panel">
    <div class="panel-title">대전 버스 실시간 관제</div>
    <div class="panel-desc">OSRM 도로망 매칭 & 양쪽 종점 방향 감지</div>

    <div class="summary-box">
      <span id="vehicle-count-label">운행 차량: 계산 중...</span>
      <span style="color:#0ca678; font-size:10px;">● 15초 갱신</span>
    </div>

    <div style="font-size:11px; font-weight:bold; color:#444; margin-bottom:4px;">관제 노선 선택 (중복 체크 가능)</div>
    <div class="route-list-wrap" id="routeList"></div>

    <div class="legend-box">
      <div class="legend-row">
        <div class="legend-line" style="background:#1a73e8;"></div>
        <span><b>상행선</b>: 도로 실선 궤적 & 진한 마커 (▲ 종점행)</span>
      </div>
      <div class="legend-row">
        <div class="legend-dashed"></div>
        <span><b>하행선</b>: 도로 점선 궤적 & 밝은 마커 (▼ 기점행)</span>
      </div>
      <div class="legend-row">
        <div class="station-pin" style="background:#495057; width:9px; height:9px; transform:none;"></div>
        <span><b>정류장 핀</b>: 클릭 시 실시간 도착 정보(분/정거장) 표출</span>
      </div>
    </div>
  </div>

  <div id="map"></div>

  <script>
    // 줌 컨트롤 우측 상단 배치 (패널 가림 완전 방지)
    const map = L.map('map', { zoomControl: false }).setView([36.3504, 127.3845], 12);
    L.control.zoom({ position: 'topright' }).addTo(map);

    L.tileLayer('https://xdworld.vworld.kr/2d/Base/service/{z}/{x}/{y}.png', {
      attribution: '&copy; VWorld',
      maxZoom: 19
    }).addTo(map);

    const lineGroup = L.layerGroup().addTo(map);
    const stationGroup = L.layerGroup().addTo(map);
    const busGroup = L.layerGroup().addTo(map);

    // 공공데이터 정규 노선 정보 (실제 605번, 급행1번 등)
    const ROUTES = [
      { id: '30300072', name: '605', type: 'trunk', color: '#1a73e8', downColor: '#00acc1', desc: '대전대동문 ↔ 갈마아파트', originName: '대전대동문', destName: '갈마아파트' },
      { id: '30300001', name: '급행1', type: 'express', color: '#d9251b', downColor: '#ff7043', desc: '원내동 ↔ 신안동', originName: '원내동', destName: '신안동' },
      { id: '30300002', name: '급행2', type: 'express', color: '#d9251b', downColor: '#ff7043', desc: '봉산동 ↔ 옥계동', originName: '봉산동', destName: '옥계동' },
      { id: '30300003', name: '급행3', type: 'express', color: '#d9251b', downColor: '#ff7043', desc: '원내동 ↔ 정부청사', originName: '원내동', destName: '정부청사' },
      { id: '30300083', name: '703', type: 'trunk', color: '#1a73e8', downColor: '#00acc1', desc: '신탄진 ↔ 정림동', originName: '신탄진', destName: '정림동' },
      { id: '30300057', name: '213', type: 'branch', color: '#2b8a3e', downColor: '#74b816', desc: '원내동 ↔ 대한통운', originName: '원내동', destName: '대한통운' },
      { id: '30300037', name: '102', type: 'trunk', color: '#1a73e8', downColor: '#00acc1', desc: '수통골 ↔ 대전역', originName: '수통골', destName: '대전역' },
      { id: '30300040', name: '105', type: 'trunk', color: '#1a73e8', downColor: '#00acc1', desc: '충대농대 ↔ 판암지구', originName: '충대농대', destName: '판암지구' },
      { id: '30300052', name: '201', type: 'trunk', color: '#1a73e8', downColor: '#00acc1', desc: '원내동 ↔ 대전역동광장', originName: '원내동', destName: '대전역동광장' },
      { id: '30300067', name: '301', type: 'trunk', color: '#1a73e8', downColor: '#00acc1', desc: '봉산동 ↔ 오월드', originName: '봉산동', destName: '오월드' }
    ];

    const activeRouteIds = new Set(['30300072']); // 기본 605번
    const stationCache = {};
    const osrmTrackCache = {}; // OSRM 도로망 궤적 캐시
    const lastBusPositions = {}; // 버스 이전 좌표 기록 (이동 벡터 추적)

    function initUI() {
      const container = document.getElementById('routeList');
      container.innerHTML = '';
      ROUTES.forEach(r => {
        const item = document.createElement('label');
        item.className = 'route-item';
        item.innerHTML = `
          <input type="checkbox" value="${r.id}" ${activeRouteIds.has(r.id) ? 'checked' : ''} onchange="toggleRoute('${r.id}', this.checked)">
          <span class="route-tag" style="background:${r.color};">${r.name}</span>
          <span style="font-weight:600; color:#333;">${r.desc}</span>
        `;
        container.appendChild(item);
      });
    }

    function toggleRoute(routeId, isChecked) {
      if (isChecked) activeRouteIds.add(routeId);
      else activeRouteIds.delete(routeId);
      refresh(true);
    }

    // 1. OSRM 도로망 매칭 엔진 호출 함수 (정류소 좌표들을 실제 차선 궤적으로 변환)
    async function fetchOsrmRoadPath(points) {
      if (points.length < 2) return points;
      
      // OSRM URL 길이 제한 고려하여 주요 경유 정류장 샘플링
      const sampled = [];
      const step = Math.max(1, Math.floor(points.length / 22));
      for (let i = 0; i < points.length; i += step) sampled.push(points[i]);
      if (sampled[sampled.length - 1] !== points[points.length - 1]) {
        sampled.push(points[points.length - 1]);
      }

      const coordString = sampled.map(p => `${p[1]},${p[0]}`).join(';');
      const osrmUrl = `https://router.project-osrm.org/route/v1/driving/${coordString}?overview=full&geometries=geojson`;

      try {
        const res = await fetch(osrmUrl);
        const json = await res.json();
        if (json.routes && json.routes[0]) {
          // OSRM [경도, 위도]를 Leaflet [위도, 경도] 형태로 변환
          return json.routes[0].geometry.coordinates.map(c => [c[1], c[0]]);
        }
      } catch (e) {
        console.warn('OSRM 도로망 연동 지연, 기본 정류장 라인 사용:', e);
      }
      return points;
    }

    // 2. 노선 정류장 핀 및 OSRM 도로 궤적 그리기
    async function drawRoutes() {
      lineGroup.clearLayers();
      stationGroup.clearLayers();
      const bounds = [];

      for (const routeId of activeRouteIds) {
        const cfg = ROUTES.find(r => r.id === routeId);
        if (!cfg) continue;

        let stations = stationCache[routeId];
        if (!stations) {
          try {
            const res = await fetch(`/api/bus/stations?routeId=${routeId}`);
            const data = await res.json();
            if (data.status === 'success' && data.stations) {
              stations = data.stations;
              stationCache[routeId] = stations;
            }
          } catch(e) {}
        }

        if (stations && stations.length > 1) {
          const half = Math.floor(stations.length / 2);
          const upSt = stations.slice(0, half + 1);
          const downSt = stations.slice(half);

          // OSRM 도로 매칭 캐싱
          let osrmUp = osrmTrackCache[`${routeId}_up`];
          let osrmDown = osrmTrackCache[`${routeId}_down`];

          if (!osrmUp) {
            osrmUp = await fetchOsrmRoadPath(upSt.map(s => [s.lat, s.lng]));
            osrmTrackCache[`${routeId}_up`] = osrmUp;
          }
          if (!osrmDown) {
            osrmDown = await fetchOsrmRoadPath(downSt.map(s => [s.lat, s.lng]));
            osrmTrackCache[`${routeId}_down`] = osrmDown;
          }

          // 상행선 (실선)
          L.polyline(osrmUp, {
            color: cfg.color, weight: 5, opacity: 0.85
          }).addTo(lineGroup);

          // 하행선 (점선)
          L.polyline(osrmDown, {
            color: cfg.downColor, weight: 4, dashArray: '7, 7', opacity: 0.9
          }).addTo(lineGroup);

          // 정류소 핀 생성 및 클릭 시 실시간 도착 정보 팝업
          const createPin = (s, isUp) => {
            const color = isUp ? cfg.color : cfg.downColor;
            const icon = L.divIcon({
              className: '',
              html: `<div class="station-pin" style="background:${color};"></div>`,
              iconSize: [12, 12]
            });

            const marker = L.marker([s.lat, s.lng], { icon }).addTo(stationGroup);
            bounds.push([s.lat, s.lng]);

            marker.on('click', async () => {
              marker.bindPopup(`<b>🚏 ${s.stationName}</b><br><span style="color:#666;">도착 정보 조회 중...</span>`).openPopup();
              try {
                const arrRes = await fetch(`/api/bus/arrivals?stopId=${s.stationId}`);
                const arrData = await arrRes.json();
                let html = `<div style="min-width:180px;"><b>🚏 ${s.stationName}</b> (${isUp ? '상행' : '하행'})<br>`;
                if (arrData.status === 'success' && arrData.arrivals?.length > 0) {
                  html += `<table class="arr-table"><tr><th>노선</th><th>도착 예정</th></tr>`;
                  arrData.arrivals.forEach(a => {
                    html += `<tr><td><b>${a.routeName}</b></td><td class="arr-time">${a.remainMin}분 (${a.remainStop}정거장 전)</td></tr>`;
                  });
                  html += `</table>`;
                } else {
                  html += `<div style="margin-top:6px; color:#888; font-size:11px;">현재 도착 예정 차량 없음</div>`;
                }
                html += `</div>`;
                marker.setPopupContent(html);
              } catch(e) {
                marker.setPopupContent(`<b>${s.stationName}</b><br><span style="color:red;">도착 정보 조회 실패</span>`);
              }
            });
          };

          upSt.forEach(s => createPin(s, true));
          downSt.forEach(s => createPin(s, false));
        }
      }

      return bounds;
    }

    // 3. 거리 계산 (하버사인 공식)
    function getDistance(lat1, lon1, lat2, lon2) {
      const R = 6371;
      const dLat = (lat2 - lat1) * Math.PI / 180;
      const dLon = (lon2 - lon1) * Math.PI / 180;
      const a = Math.sin(dLat/2) * Math.sin(dLat/2) +
                Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
                Math.sin(dLon/2) * Math.sin(dLon/2);
      return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
    }

    // 4. 실시간 버스 주행 마커 (양쪽 종점 기준 이동 방향 감지)
    async function updateVehicles() {
      busGroup.clearLayers();
      let count = 0;

      for (const routeId of activeRouteIds) {
        const cfg = ROUTES.find(r => r.id === routeId);
        if (!cfg) continue;

        try {
          const res = await fetch(`/api/bus/positions?routeId=${routeId}`);
          const data = await res.json();

          if (data.status === 'success' && data.vehicles) {
            count += data.vehicles.length;
            const stations = stationCache[routeId] || [];
            
            // 기점(Origin)과 종점/회차지(Dest) 정류장 좌표
            const originCoord = stations.length > 0 ? [stations[0].lat, stations[0].lng] : [36.335, 127.458];
            const destCoord = stations.length > 1 ? [stations[Math.floor(stations.length/2)].lat, stations[Math.floor(stations.length/2)].lng] : [36.354, 127.375];

            data.vehicles.forEach(bus => {
              const busKey = `${routeId}_${bus.plateNo}`;
              let isUp = true;

              // 버스의 이전 위치 기록이 있는 경우: 종점 쪽으로 가까워지면 상행, 기점 쪽으로 가면 하행
              if (lastBusPositions[busKey]) {
                const prev = lastBusPositions[busKey];
                const prevDistToDest = getDistance(prev.lat, prev.lng, destCoord[0], destCoord[1]);
                const currDistToDest = getDistance(bus.lat, bus.lng, destCoord[0], destCoord[1]);

                // 종점에 더 가까워지고 있으면 상행, 멀어지면 하행
                if (Math.abs(prevDistToDest - currDistToDest) > 0.02) {
                  isUp = currDistToDest < prevDistToDest;
                } else {
                  isUp = bus.stopSeq <= Math.floor(stations.length / 2);
                }
              } else {
                // 이전 기록이 없을 땐 정류장 순번 보조 판별
                isUp = bus.stopSeq <= Math.floor(stations.length / 2);
              }

              // 최신 좌표 저장
              lastBusPositions[busKey] = { lat: bus.lat, lng: bus.lng, isUp };

              const dirLabel = isUp ? `▲ ${cfg.destName}행` : `▼ ${cfg.originName}행`;
              const color = isUp ? cfg.color : cfg.downColor;

              const icon = L.divIcon({
                className: '',
                html: `
                  <div class="bus-marker" style="background:${color};">
                    <span>🚌 ${cfg.name}</span>
                    <span class="bus-dir">${dirLabel}</span>
                  </div>
                `,
                iconSize: [0, 0]
              });

              L.marker([bus.lat, bus.lng], { icon })
                .bindPopup(`
                  <div style="font-size:12px; line-height:1.5;">
                    <b style="font-size:13px; color:${cfg.color};">${cfg.name}번 (${dirLabel})</b><br>
                    <b>노선:</b> ${cfg.desc}<br>
                    <b>차량번호:</b> ${bus.plateNo}<br>
                    <b>현재 통과 순번:</b> ${bus.stopSeq}번째 정류소<br>
                    <b>갱신:</b> ${new Date(bus.updatedAt).toLocaleTimeString()}
                  </div>
                `)
                .addTo(busGroup);
            });
          }
        } catch(e) {}
      }

      document.getElementById('vehicle-count-label').textContent = `운행 차량: 총 ${count}대`;
    }

    async function refresh(autoFit = false) {
      const bounds = await drawRoutes();
      await updateVehicles();
      if (autoFit && bounds.length > 0) {
        map.fitBounds(bounds, { padding: [50, 50], maxZoom: 14 });
      }
    }

    initUI();
    refresh(true);
    setInterval(updateVehicles, 15000);
  </script>
</body>
</html>
