<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

  <title>대전 실시간 버스 위치 관제 | 대전 시내버스 실시간 노선도</title>
  <meta name="description" content="대전광역시 시내버스 전 노선 실시간 주행 위치 및 정류소 도착 예정 시간 안내 지도. 급행1, 605, 703, 213 등 대전 버스 실시간 모니터링.">
  <meta name="keywords" content="대전 버스 실시간, 대전 시내버스 위치, 대전 버스 도착시간, 605번 버스, 급행1번, 703번, 대전 대중교통 지도, 대전 버스 노선도">
  <link rel="canonical" href="https://daejeon-transit-api.vercel.app/" />
  <meta name="geo.region" content="KR-30" />
  <meta name="geo.placename" content="Daejeon" />

  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #fff; }
    #map { width: 100%; height: 100%; }

    /* 상단 슬림 관제 패널 */
    .top-panel {
      position: absolute; top: 12px; left: 12px; z-index: 1000;
      width: calc(100% - 24px); max-width: 320px;
    }
    .panel-card {
      background: rgba(255, 255, 255, 0.96); padding: 12px 14px;
      border-radius: 12px; box-shadow: 0 4px 18px rgba(0,0,0,0.16);
      backdrop-filter: blur(8px);
    }
    .panel-header-row {
      display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px;
    }
    .panel-title { font-size: 15px; font-weight: 800; color: #111; }
    .countdown-tag {
      font-size: 11px; font-weight: 700; color: #0ca678; background: #e6fcf5;
      padding: 3px 8px; border-radius: 12px;
    }
    .status-row {
      display: flex; justify-content: space-between; align-items: center;
      font-size: 11px; color: #495057; font-weight: 600; margin-bottom: 8px;
    }
    .live-dot {
      display: inline-block; width: 8px; height: 8px; border-radius: 50%;
      background: #40c057; margin-right: 4px; vertical-align: middle;
      box-shadow: 0 0 6px #40c057;
    }

    /* 드롭다운 버튼 */
    .dropdown-btn {
      width: 100%; padding: 8px 12px; background: #f1f3f5; border: 1px solid #ced4da;
      border-radius: 8px; font-size: 13px; font-weight: 700; color: #333; text-align: left;
      cursor: pointer; display: flex; justify-content: space-between; align-items: center;
    }
    .dropdown-btn:after { content: '▼'; font-size: 10px; color: #666; }
    .dropdown-content {
      display: none; background: #fff; border: 1px solid #dee2e6; border-radius: 8px;
      box-shadow: 0 6px 16px rgba(0,0,0,0.15); max-height: 220px; overflow-y: auto;
      margin-top: 6px; padding: 6px; flex-direction: column; gap: 4px;
    }
    .dropdown-content.show { display: flex; }
    .route-item {
      display: flex; align-items: center; gap: 8px; padding: 6px 8px; border-radius: 6px;
      font-size: 12px; cursor: pointer; user-select: none;
    }
    .route-item:hover { background: #f1f3f5; }
    .route-item input { accent-color: #1a73e8; cursor: pointer; }
    .route-label-badge {
      font-weight: bold; color: #fff; padding: 2px 6px; border-radius: 4px; font-size: 11px;
    }

    /* 좌측 하단 범례 */
    .bottom-legend {
      position: absolute; bottom: 16px; left: 12px; z-index: 1000;
      background: rgba(255, 255, 255, 0.94); padding: 8px 12px; border-radius: 8px;
      box-shadow: 0 3px 12px rgba(0,0,0,0.15); backdrop-filter: blur(4px);
      font-size: 11px; color: #333; display: flex; flex-direction: column; gap: 4px;
    }
    .legend-row { display: flex; align-items: center; gap: 6px; }
    .legend-bar-solid { width: 16px; height: 4px; background: #1a73e8; border-radius: 2px; }
    .legend-bar-dash { width: 16px; height: 0; border-top: 3px dashed #00acc1; }

    /* 버스 진행 방향(머리) 및 360도 도로 회전 마커 */
    .bus-carrier-wrap {
      width: 44px;
      height: 44px;
      transform: translate(-50%, -50%);
      cursor: pointer;
      position: relative;
    }
    /* 도로 진행 방향으로 회전하는 버스 차체 (탑다운 뷰) */
    .bus-body-graphics {
      width: 100%;
      height: 100%;
      position: absolute;
      top: 0;
      left: 0;
      transition: transform 0.25s linear;
      transform-origin: 22px 22px;
    }
    .bus-topdown-svg {
      width: 100%;
      height: 100%;
      filter: drop-shadow(0px 2px 4px rgba(0, 0, 0, 0.5));
    }
    /* 노선 번호는 회전하지 않고 항상 수평(정방향) 유지 */
    .bus-fixed-number {
      position: absolute;
      top: 15px;
      left: 6px;
      width: 32px;
      text-align: center;
      font-size: 10px;
      font-weight: 900;
      color: #ffffff;
      background: rgba(0, 0, 0, 0.75);
      border-radius: 3px;
      padding: 0 1px;
      line-height: 14px;
      pointer-events: none;
      letter-spacing: -0.5px;
      z-index: 10;
      border: 1px solid rgba(255,255,255,0.4);
    }

    /* 정류소 핀 */
    .station-pin {
      width: 11px; height: 11px; border-radius: 50%; border: 2px solid #fff;
      box-shadow: 0 2px 5px rgba(0,0,0,0.4); cursor: pointer; transform: translate(-50%, -50%);
      transition: transform 0.15s ease;
    }
    .station-pin:hover { transform: translate(-50%, -50%) scale(1.3); }

    /* 정류소 도착 정보 팝업 */
    .arrival-popup { min-width: 200px; font-size: 12px; }
    .arrival-title { font-size: 13px; font-weight: 800; color: #111; border-bottom: 1px solid #eee; padding-bottom: 4px; margin-bottom: 6px; }
    .arr-table { width: 100%; border-collapse: collapse; margin-top: 4px; font-size: 11px; }
    .arr-table th, .arr-table td { padding: 4px 2px; text-align: left; border-bottom: 1px solid #f1f3f5; }
    .arr-time { color: #e03131; font-weight: 800; }
  </style>
</head>
<body>

  <div class="top-panel">
    <div class="panel-card">
      <div class="panel-header-row">
        <div class="panel-title">대전 실시간 버스 관제</div>
        <div class="countdown-tag" id="countdownLabel">● 15초 후 갱신</div>
      </div>
      <div class="status-row">
        <span id="vehicleCountLabel">운행 차량: 확인 중...</span>
        <span id="liveSyncStatus"><span class="live-dot"></span><span id="syncTimeText">대기 중</span></span>
      </div>

      <button class="dropdown-btn" id="dropdownToggleBtn" onclick="toggleDropdown()">
        <span id="selectedRouteSummary">관제 노선 선택 (605)</span>
      </button>

      <div class="dropdown-content" id="dropdownRouteList"></div>
    </div>
  </div>

  <div class="bottom-legend">
    <div class="legend-row">
      <div class="legend-bar-solid"></div>
      <span><b>상행선</b> (실선 · 진한 색)</span>
    </div>
    <div class="legend-row">
      <div class="legend-bar-dash"></div>
      <span><b>하행선</b> (점선 · 밝은 색)</span>
    </div>
    <div style="color: #666; font-size: 10px; margin-top: 2px;">
      * 버스 앞부분의 굵은 1자 라인이 머리(진행 방향)
    </div>
  </div>

  <div id="map"></div>

  <script>
    const map = L.map('map', { zoomControl: false }).setView([36.3504, 127.3845], 12);
    L.control.zoom({ position: 'bottomright' }).addTo(map);

    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      attribution: '&copy; OpenStreetMap contributors',
      maxZoom: 19
    }).addTo(map);

    const lineGroup = L.layerGroup().addTo(map);
    const stationGroup = L.layerGroup().addTo(map);
    const busGroup = L.layerGroup().addTo(map);

    const activeBusTracker = {};

    const OFFICIAL_ROUTES = [
      { id: '30300072', name: '605', type: 'trunk', origin: '대전대동문', dest: '갈마아파트' },
      { id: '30300001', name: '1', type: 'express', origin: '원내동', dest: '신안동' },
      { id: '30300002', name: '2', type: 'express', origin: '봉산동', dest: '옥계동' },
      { id: '30300003', name: '3', type: 'express', origin: '원내동', dest: '정부청사' },
      { id: '30300083', name: '703', type: 'trunk', origin: '신탄진', dest: '정림동' },
      { id: '30300057', name: '213', type: 'branch', origin: '원내동', dest: '대한통운' },
      { id: '30300037', name: '102', type: 'trunk', origin: '수통골', dest: '대전역' },
      { id: '30300040', name: '105', type: 'trunk', origin: '충대농대', dest: '판암지구' },
      { id: '30300041', name: '106', type: 'trunk', origin: '목원대', dest: '비래동' },
      { id: '30300052', name: '201', type: 'trunk', origin: '원내동', dest: '대전역동광장' },
      { id: '30300067', name: '301', type: 'trunk', origin: '봉산동', dest: '오월드' }
    ];

    const activeRouteIds = new Set(['30300072']);
    const stationCache = {};
    const routeLineSegments = {};
    let countdown = 15;

    function getRouteColor(name, type, isDown = false) {
      if (type === 'express') {
        if (name === '1' || name === '급행1') return isDown ? '#ff6b6b' : '#c92a2a';
        if (name === '2' || name === '급행2') return isDown ? '#ffa94d' : '#d9480f';
        return isDown ? '#f06595' : '#a61e4d';
      }
      let hash = 0;
      for (let i = 0; i < name.length; i++) hash = name.charCodeAt(i) + ((hash << 5) - hash);
      const hue = Math.abs(hash % 360);
      const sat = type === 'branch' ? 65 : 75;
      const light = isDown ? 62 : 40;
      return `hsl(${hue}, ${sat}%, ${light}%)`;
    }

    function toggleDropdown() {
      document.getElementById('dropdownRouteList').classList.toggle('show');
    }

    function initRouteUI() {
      const container = document.getElementById('dropdownRouteList');
      container.innerHTML = '';

      OFFICIAL_ROUTES.forEach(r => {
        const item = document.createElement('label');
        item.className = 'route-item';
        const typeLabel = r.type === 'express' ? '[급행]' : (r.type === 'branch' ? '[지선]' : '[간선]');
        const color = getRouteColor(r.name, r.type, false);

        item.innerHTML = `
          <input type="checkbox" value="${r.id}" ${activeRouteIds.has(r.id) ? 'checked' : ''} onchange="toggleRoute('${r.id}', this.checked)">
          <span class="route-label-badge" style="background:${color};">${typeLabel} ${r.name}</span>
          <span style="color:#555;">${r.origin} ↔ ${r.dest}</span>
        `;
        container.appendChild(item);
      });
      updateSelectedSummary();
    }

    function toggleRoute(routeId, isChecked) {
      if (isChecked) activeRouteIds.add(routeId);
      else activeRouteIds.delete(routeId);
      updateSelectedSummary();
      refresh(true);
    }

    function updateSelectedSummary() {
      const names = [];
      OFFICIAL_ROUTES.forEach(r => {
        if (activeRouteIds.has(r.id)) {
          const typePrefix = r.type === 'express' ? '급행' : '';
          names.push(`${typePrefix}${r.name}`);
        }
      });
      document.getElementById('selectedRouteSummary').textContent = names.length > 0 
        ? `관제 중: ${names.join(', ')}`
        : '노선을 선택해 주세요';
    }

    // 도로 선분 상의 최근접 위치 및 인덱스 검색 (경로 추적용)
    function getClosestPointOnPolyline(lat, lng, routeId) {
      const segments = routeLineSegments[routeId];
      if (!segments || segments.length === 0) return { point: [lat, lng], index: 0 };

      let minDist = Infinity;
      let closest = [lat, lng];
      let matchIdx = 0;

      for (let i = 0; i < segments.length - 1; i++) {
        const p1 = segments[i], p2 = segments[i + 1];
        const x = lng, y = lat;
        const x1 = p1[1], y1 = p1[0];
        const x2 = p2[1], y2 = p2[0];

        const dx = x2 - x1, dy = y2 - y1;
        if (dx === 0 && dy === 0) continue;

        const t = Math.max(0, Math.min(1, ((x - x1) * dx + (y - y1) * dy) / (dx * dx + dy * dy)));
        const projLng = x1 + t * dx;
        const projLat = y1 + t * dy;

        const distSq = (x - projLng) * (x - projLng) + (y - projLat) * (y - projLat);
        if (distSq < minDist) {
          minDist = distSq;
          closest = [projLat, projLng];
          matchIdx = i;
        }
      }

      return { point: (minDist < 0.0000008 ? closest : [lat, lng]), index: matchIdx };
    }

    async function drawRoutes() {
      lineGroup.clearLayers();
      stationGroup.clearLayers();
      const bounds = [];

      for (const routeId of activeRouteIds) {
        const cfg = OFFICIAL_ROUTES.find(r => r.id === routeId);
        if (!cfg) continue;

        let stations = stationCache[routeId];
        if (!stations) {
          try {
            const res = await fetch(`/api/bus/stations?routeId=${routeId}`);
            const data = await res.json();
            if (data.status === 'success' && data.stations) {
              stations = data.stations;
              stationCache[routeId] = stations;
            }
          } catch(e) {}
        }

        if (stations && stations.length > 1) {
          const half = Math.floor(stations.length / 2);
          const upSt = stations.slice(0, half + 1);
          const downSt = stations.slice(half);

          const upCoords = upSt.map(s => [s.lat, s.lng]);
          const downCoords = downSt.map(s => [s.lat, s.lng]);

          routeLineSegments[routeId] = [...upCoords, ...downCoords];

          const upColor = getRouteColor(cfg.name, cfg.type, false);
          const downColor = getRouteColor(cfg.name, cfg.type, true);

          L.polyline(upCoords, { color: upColor, weight: 5, opacity: 0.85, lineJoin: 'round' }).addTo(lineGroup);
          L.polyline(downCoords, { color: downColor, weight: 4, dashArray: '7, 7', opacity: 0.9, lineJoin: 'round' }).addTo(lineGroup);

          const createPin = (s, isUp) => {
            const color = isUp ? upColor : downColor;
            const destTargetName = isUp ? cfg.dest : cfg.origin;

            const icon = L.divIcon({
              className: '',
              html: `<div class="station-pin" style="background:${color};"></div>`,
              iconSize: [11, 11]
            });

            const marker = L.marker([s.lat, s.lng], { icon }).addTo(stationGroup);
            bounds.push([s.lat, s.lng]);

            marker.on('click', async () => {
              const queryStopId = s.stationId || s.arsId;

              marker.bindPopup(`
                <div class="arrival-popup">
                  <div class="arrival-title">🚏 ${s.stationName}</div>
                  <div style="color:#666; font-size:11px;">방면: ${destTargetName}</div>
                  <div style="margin-top:6px; color:#1a73e8; font-weight:bold;">실시간 도착 정보 조회 중...</div>
                </div>
              `).openPopup();

              try {
                if (!queryStopId) throw new Error('정류소 ID 없음');
                const arrRes = await fetch(`/api/bus/arrivals?stopId=${encodeURIComponent(queryStopId)}`);
                const arrData = await arrRes.json();

                let html = `
                  <div class="arrival-popup">
                    <div class="arrival-title">🚏 ${s.stationName}</div>
                    <div style="color:#666; font-size:11px;">방면: ${destTargetName} (${isUp ? '상행' : '하행'})</div>
                `;

                if (arrData.status === 'success' && arrData.arrivals && arrData.arrivals.length > 0) {
                  html += `<table class="arr-table"><tr><th>노선</th><th>도착 예정</th></tr>`;
                  arrData.arrivals.forEach(a => {
                    html += `<tr><td><b>${a.routeName}</b></td><td class="arr-time">${a.remainMin} (${a.remainStop})</td></tr>`;
                  });
                  html += `</table>`;
                } else {
                  html += `<div style="margin-top:6px; color:#888; font-size:11px;">현재 15분 이내 도착 예정 버스가 없습니다.</div>`;
                }
                html += `</div>`;
                marker.setPopupContent(html);
              } catch(e) {
                marker.setPopupContent(`
                  <div class="arrival-popup">
                    <div class="arrival-title">🚏 ${s.stationName}</div>
                    <div style="color:#e03131; font-size:11px;">도착 정보를 불러오지 못했습니다.</div>
                  </div>
                `);
              }
            });
          };

          upSt.forEach(s => createPin(s, true));
          downSt.forEach(s => createPin(s, false));
        }
      }

      return bounds;
    }

    // 도로 360도 회전용 버스 그래픽 SVG (앞머리에 찐하고 굵은 1자 바 탑재)
    // 기본 기준: 0도는 위쪽(북쪽)을 향함
    function createTopDownBusSvg(color) {
      return `
        <svg class="bus-topdown-svg" viewBox="0 0 44 44" fill="none" xmlns="http://www.w3.org/2000/svg">
          <!-- 버스 몸체 (세로 직사각형 - 위가 앞머리) -->
          <rect x="12" y="5" width="20" height="34" rx="5" fill="${color}" stroke="#ffffff" stroke-width="1.8"/>
          
          <!-- ★ 버스 앞머리 강조: 찐한 굵은 1자 라인 (검정 수직 바 + 중앙 옐로우 포인트) -->
          <rect x="13" y="5" width="18" height="4.5" rx="1.5" fill="#111111" stroke="#ffffff" stroke-width="0.8"/>
          <rect x="18" y="6" width="8" height="2" rx="0.5" fill="#FFD600"/>

          <!-- 전면 윈드실드 창문 -->
          <rect x="14" y="11" width="16" height="5" rx="1.5" fill="#ffffff" opacity="0.85"/>
          
          <!-- 양옆 사이드 미러 (머리 구분 보조) -->
          <rect x="9" y="8" width="3" height="4" rx="1" fill="#222222"/>
          <rect x="32" y="8" width="3" height="4" rx="1" fill="#222222"/>

          <!-- 후면 테일램프 -->
          <circle cx="15" cy="37" r="1.3" fill="#E53935"/>
          <circle cx="29" cy="37" r="1.3" fill="#E53935"/>
        </svg>
      `;
    }

    // 두 좌표 간 방위각 계산 (0°: 북, 90°: 동, 180°: 남, 270°: 서)
    function calculateBearing(lat1, lon1, lat2, lon2) {
      const y = Math.sin((lon2 - lon1) * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180);
      const x = Math.cos(lat1 * Math.PI / 180) * Math.sin(lat2 * Math.PI / 180) -
                Math.sin(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) * Math.cos((lon2 - lon1) * Math.PI / 180);
      return (Math.atan2(y, x) * 180 / Math.PI + 360) % 360;
    }

    // 실제 도로 궤적(Polyline)을 따라 곡선을 밟으며 달리는 도로 추종 주행 엔진
    function animateAlongRoadPath(tracker, pathPoints, durationMs = 14000) {
      if (tracker.animFrame) cancelAnimationFrame(tracker.animFrame);
      if (!pathPoints || pathPoints.length < 2) return;

      // 각 도로 구간별 거리 누적 합 계산
      const dists = [0];
      let totalDist = 0;
      for (let i = 0; i < pathPoints.length - 1; i++) {
        const dLat = pathPoints[i+1][0] - pathPoints[i][0];
        const dLng = pathPoints[i+1][1] - pathPoints[i][1];
        const segDist = Math.sqrt(dLat * dLat + dLng * dLng);
        totalDist += segDist;
        dists.push(totalDist);
      }

      const startTime = performance.now();

      function step(now) {
        const elapsed = now - startTime;
        const progress = Math.min(1, elapsed / durationMs);

        // 부드러운 가감속
        const ease = progress < 0.5 ? 2 * progress * progress : -1 + (4 - 2 * progress) * progress;
        const targetDist = ease * totalDist;

        // 현재 거리에 해당하는 도로 세그먼트 찾기
        let segIdx = 0;
        for (let i = 0; i < dists.length - 1; i++) {
          if (targetDist >= dists[i] && targetDist <= dists[i+1]) {
            segIdx = i;
            break;
          }
        }

        const segLen = dists[segIdx+1] - dists[segIdx];
        const segProgress = segLen > 0 ? (targetDist - dists[segIdx]) / segLen : 0;

        const p1 = pathPoints[segIdx];
        const p2 = pathPoints[segIdx+1];

        const curLat = p1[0] + (p2[0] - p1[0]) * segProgress;
        const curLng = p1[1] + (p2[1] - p1[1]) * segProgress;

        tracker.currentLat = curLat;
        tracker.currentLng = curLng;
        tracker.marker.setLatLng([curLat, curLng]);

        // 현재 달리고 있는 도로 선분의 방위각으로 버스 차체 회전
        const angle = calculateBearing(p1[0], p1[1], p2[0], p2[1]);
        if (tracker.domBody) {
          tracker.domBody.style.transform = `rotate(${angle}deg)`;
        }

        if (progress < 1) {
          tracker.animFrame = requestAnimationFrame(step);
        }
      }

      tracker.animFrame = requestAnimationFrame(step);
    }

    async function updateVehicles() {
      let totalCount = 0;
      const currentKeys = new Set();

      for (const routeId of activeRouteIds) {
        const cfg = OFFICIAL_ROUTES.find(r => r.id === routeId);
        if (!cfg) continue;

        try {
          const res = await fetch(`/api/bus/positions?routeId=${routeId}&_t=${Date.now()}`);
          const data = await res.json();

          if (data.status === 'success') {
            document.getElementById('syncTimeText').textContent = `${data.serverTime || new Date().toLocaleTimeString()} 갱신`;

            if (data.vehicles && data.vehicles.length > 0) {
              totalCount += data.vehicles.length;
              const stations = stationCache[routeId] || [];
              const halfSeq = Math.floor(stations.length / 2) || 40;
              const allSegments = routeLineSegments[routeId] || [];

              data.vehicles.forEach((bus, idx) => {
                const busKey = `${routeId}_${bus.plateNo || idx}`;
                currentKeys.add(busKey);

                // 도로 선상에 스냅된 좌표 및 인덱스
                const snapInfo = getClosestPointOnPolyline(bus.lat, bus.lng, routeId);
                const snapped = snapInfo.point;
                const snapIdx = snapInfo.index;

                const isUp = bus.stopSeq <= halfSeq;
                const markerBg = getRouteColor(cfg.name, cfg.type, !isUp);
                const targetDest = isUp ? cfg.dest : cfg.origin;

                if (activeBusTracker[busKey]) {
                  const tracker = activeBusTracker[busKey];

                  // 시작 위치에서 목적지 위치까지의 도로 궤적 추출
                  let roadPath = [];
                  const startInfo = getClosestPointOnPolyline(tracker.currentLat, tracker.currentLng, routeId);
                  const startIdx = startInfo.index;

                  if (allSegments.length > 0 && Math.abs(snapIdx - startIdx) > 0 && Math.abs(snapIdx - startIdx) < 8) {
                    if (startIdx <= snapIdx) {
                      roadPath = [ [tracker.currentLat, tracker.currentLng], ...allSegments.slice(startIdx + 1, snapIdx + 1), snapped ];
                    } else {
                      const sliced = allSegments.slice(snapIdx, startIdx + 1).reverse();
                      roadPath = [ [tracker.currentLat, tracker.currentLng], ...sliced, snapped ];
                    }
                  } else {
                    roadPath = [ [tracker.currentLat, tracker.currentLng], snapped ];
                  }

                  // 도로 커브를 따라 달리는 애니메이션 실행
                  animateAlongRoadPath(tracker, roadPath, 14000);

                  tracker.marker.setPopupContent(`
                    <div style="font-size:12px; line-height:1.5;">
                      <b style="font-size:13px; color:${markerBg};">${cfg.name}번 버스</b><br>
                      <b>행선지:</b> ${targetDest} 방면 (${isUp ? '상행' : '하행'})<br>
                      <b>차량번호:</b> ${bus.plateNo}<br>
                      <b>현재 통과:</b> ${bus.stopSeq}번째 정류소<br>
                      <b>갱신:</b> ${new Date().toLocaleTimeString()} (정상 주행)
                    </div>
                  `);
                } else {
                  const bodyElementId = `bus-body-${busKey.replace(/[^a-zA-Z0-9]/g, '_')}`;
                  const busIcon = L.divIcon({
                    className: '',
                    html: `
                      <div class="bus-carrier-wrap">
                        <!-- 도로 진행 방향으로 360도 회전하는 차체 -->
                        <div class="bus-body-graphics" id="${bodyElementId}">
                          ${createTopDownBusSvg(markerBg)}
                        </div>
                        <!-- 숫자는 회전하지 않고 항상 수평(정방향) 유지 -->
                        <div class="bus-fixed-number">${cfg.name}</div>
                      </div>
                    `,
                    iconSize: [0, 0]
                  });

                  const marker = L.marker(snapped, { icon: busIcon })
                    .bindPopup(`
                      <div style="font-size:12px; line-height:1.5;">
                        <b style="font-size:13px; color:${markerBg};">${cfg.name}번 버스</b><br>
                        <b>행선지:</b> ${targetDest} 방면 (${isUp ? '상행' : '하행'})<br>
                        <b>차량번호:</b> ${bus.plateNo}<br>
                        <b>현재 통과:</b> ${bus.stopSeq}번째 정류소<br>
                        <b>갱신:</b> ${new Date().toLocaleTimeString()}
                      </div>
                    `);

                  busGroup.addLayer(marker);

                  const tracker = {
                    marker,
                    currentLat: snapped[0],
                    currentLng: snapped[1],
                    animFrame: null,
                    domBody: null
                  };

                  activeBusTracker[busKey] = tracker;

                  setTimeout(() => {
                    tracker.domBody = document.getElementById(bodyElementId);
                  }, 50);
                }
              });
            }
          }
        } catch(e) {
          console.error(e);
        }
      }

      Object.keys(activeBusTracker).forEach(key => {
        if (!currentKeys.has(key)) {
          if (activeBusTracker[key].animFrame) cancelAnimationFrame(activeBusTracker[key].animFrame);
          busGroup.removeLayer(activeBusTracker[key].marker);
          delete activeBusTracker[key];
        }
      });

      document.getElementById('vehicleCountLabel').textContent = `운행 차량: 총 ${totalCount}대`;
    }

    async function refresh(autoFit = false) {
      const bounds = await drawRoutes();
      await updateVehicles();
      if (autoFit && bounds.length > 0) {
        map.fitBounds(bounds, { padding: [50, 50], maxZoom: 14 });
      }
    }

    setInterval(() => {
      countdown--;
      if (countdown <= 0) {
        countdown = 15;
        document.getElementById('countdownLabel').textContent = '● 주행 갱신 중...';
        updateVehicles().then(() => {
          document.getElementById('countdownLabel').textContent = `● 15초 후 갱신`;
        });
      } else {
        document.getElementById('countdownLabel').textContent = `● ${countdown}초 후 갱신`;
      }
    }, 1000);

    window.addEventListener('click', (e) => {
      const dropdown = document.getElementById('dropdownRouteList');
      const toggleBtn = document.getElementById('dropdownToggleBtn');
      if (!toggleBtn.contains(e.target) && !dropdown.contains(e.target)) {
        dropdown.classList.remove('show');
      }
    });

    initRouteUI();
    refresh(true);
  </script>
</body>
</html>
