<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  
  <title>대전 실시간 버스 위치 관제 | 대전 시내버스 실시간 노선도</title>
  <meta name="description" content="대전광역시 공공데이터포털 실시간 버스 위치 및 정류소 기반 실제 노선도 지도. 급행1, 605, 703, 213번 등 양방향 실시간 관제.">
  <meta name="geo.region" content="KR-30" />
  <meta name="geo.placename" content="Daejeon" />

  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body, html { width: 100%; height: 100%; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Malgun Gothic", sans-serif; }
    
    .app-container { position: relative; width: 100%; height: 85vh; overflow: hidden; }
    #map { width: 100%; height: 100%; }

    /* 컨트롤 패널 */
    .status-panel {
      position: absolute;
      top: 16px;
      left: 16px;
      z-index: 1000;
      background: rgba(255, 255, 255, 0.96);
      padding: 16px 20px;
      border-radius: 12px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.15);
      backdrop-filter: blur(6px);
      min-width: 260px;
    }
    .status-panel h1 { font-size: 16px; font-weight: 700; color: #111; margin-bottom: 2px; }
    .status-panel .subtitle { font-size: 11px; color: #666; margin-bottom: 12px; }
    
    .route-select-wrap { margin-bottom: 12px; }
    .route-select-wrap label { font-size: 11px; font-weight: 700; color: #555; display: block; margin-bottom: 4px; }
    .route-select {
      width: 100%;
      padding: 8px 10px;
      border: 1px solid #dcdfe6;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 600;
      color: #222;
      outline: none;
      background: #fdfdfd;
      cursor: pointer;
    }
    .route-select:focus { border-color: #1a73e8; }

    .meta-info {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
      font-size: 12px;
      color: #444;
    }
    .badge {
      display: inline-block;
      padding: 3px 8px;
      font-size: 11px;
      font-weight: 600;
      border-radius: 20px;
      background: #e6f4ea;
      color: #137333;
    }

    .dir-legend {
      display: flex;
      gap: 10px;
      margin-top: 10px;
      padding-top: 10px;
      border-top: 1px solid #eee;
      font-size: 11px;
      color: #555;
    }
    .legend-item { display: flex; align-items: center; gap: 4px; }
    .dot { width: 10px; height: 10px; border-radius: 50%; }

    /* 버스 마커 스타일 */
    .bus-marker {
      display: flex;
      align-items: center;
      gap: 4px;
      color: #fff;
      font-size: 11px;
      font-weight: 700;
      padding: 4px 8px;
      border-radius: 20px;
      box-shadow: 0 3px 8px rgba(0,0,0,0.35);
      border: 2px solid #fff;
      white-space: nowrap;
      cursor: pointer;
    }
    .dir-tag {
      font-size: 9px;
      padding: 1px 4px;
      border-radius: 4px;
      background: rgba(0,0,0,0.25);
    }

    /* 노선 테마 색상 */
    .express-up { background: #d9251b; }
    .express-down { background: #ff6b6b; color: #222; }
    .trunk-up { background: #1a73e8; }
    .trunk-down { background: #00bcd4; color: #111; }
    .branch-up { background: #28a745; }
    .branch-down { background: #8bc34a; color: #111; }

    /* SEO 안내 영역 */
    .seo-content-section {
      padding: 30px 24px;
      background: #fafafa;
      border-top: 1px solid #eaeaea;
      color: #333;
      line-height: 1.6;
    }
    .seo-container { max-width: 960px; margin: 0 auto; }
    .seo-container h2 { font-size: 18px; font-weight: 700; margin-bottom: 12px; color: #111; }
    .seo-container p { font-size: 14px; color: #555; margin-bottom: 16px; }
  </style>
</head>
<body>

  <main class="app-container">
    <div class="status-panel">
      <h1>대전 실시간 버스 관제</h1>
      <div class="subtitle">실제 정류소 경유 노선 궤적 연동</div>
      
      <div class="route-select-wrap">
        <label for="route-selector">노선 선택</label>
        <select id="route-selector" class="route-select" onchange="changeRoute(this.value)">
          <option value="30300001" data-type="express" data-name="급행1" data-up="신탄진 방면" data-down="원내동 방면">급행 1번 (원내동 ↔ 신탄진)</option>
          <option value="30300002" data-type="express" data-name="급행2" data-up="옥계동 방면" data-down="봉산동 방면">급행 2번 (봉산동 ↔ 옥계동)</option>
          <option value="30300003" data-type="express" data-name="급행3" data-up="정부청사 방면" data-down="원내동 방면">급행 3번 (원내동 ↔ 정부청사)</option>
          <option value="30300075" data-type="trunk" data-name="605" data-up="갈마아파트 방면" data-down="대전대 방면">605번 (대전대 ↔ 갈마아파트)</option>
          <option value="30300083" data-type="trunk" data-name="703" data-up="정림동 방면" data-down="신탄진 방면">703번 (신탄진 ↔ 정림동)</option>
          <option value="30300057" data-type="branch" data-name="213" data-up="대한통운 방면" data-down="원내동 방면">213번 (원내동 ↔ 대한통운)</option>
          <option value="30300037" data-type="trunk" data-name="102" data-up="대전역 방면" data-down="수통골 방면">102번 (수통골 ↔ 대전역)</option>
          <option value="30300040" data-type="trunk" data-name="105" data-up="판암지구 방면" data-down="충대농대 방면">105번 (충대농대 ↔ 판암지구)</option>
          <option value="30300052" data-type="trunk" data-name="201" data-up="대전역동광장 방면" data-down="원내동 방면">201번 (원내동 ↔ 대전역동광장)</option>
          <option value="30300067" data-type="trunk" data-name="301" data-up="오월드 방면" data-down="봉산동 방면">301번 (봉산동 ↔ 오월드)</option>
        </select>
      </div>

      <div class="meta-info">
        <span id="bus-count">운행 차량: 확인 중...</span>
        <span class="badge" id="sync-status">자동 동기화</span>
      </div>

      <div class="dir-legend">
        <div class="legend-item">
          <div class="dot" id="legend-up-dot" style="background: #d9251b;"></div>
          <span id="legend-up-text">상행</span>
        </div>
        <div class="legend-item">
          <div class="dot" id="legend-down-dot" style="background: #ff6b6b;"></div>
          <span id="legend-down-text">하행</span>
        </div>
      </div>
    </div>

    <div id="map"></div>
  </main>

  <section class="seo-content-section">
    <div class="seo-container">
      <h2>대전광역시 시내버스 실시간 노선도 및 차량 관제 안내</h2>
      <p>
        본 시스템은 대전광역시 정류소 경유 정보 API와 버스 실시간 위치 API를 결합하여 도로망을 따르는 굴곡 노선도와 실제 주행 중인 버스의 양방향 위치를 시각화합니다.
      </p>
    </div>
  </section>

  <script>
    const map = L.map('map').setView([36.3504, 127.3845], 12);

    L.tileLayer('https://xdworld.vworld.kr/2d/Base/service/{z}/{x}/{y}.png', {
      attribution: '&copy; VWorld 국가공간정보포털',
      maxZoom: 19
    }).addTo(map);

    const busLayerGroup = L.layerGroup().addTo(map);
    const routeLineGroup = L.layerGroup().addTo(map);

    let currentRouteId = '30300001';
    let currentRouteName = '급행1';
    let currentRouteType = 'express';
    let upDestText = '신탄진 방면';
    let downDestText = '원내동 방면';
    let timerId = null;

    // 테마 색상 반환
    function getThemeColor() {
      if (currentRouteType === 'express') return '#d9251b';
      if (currentRouteType === 'branch') return '#28a745';
      return '#1a73e8';
    }

    // 1. 노선 실제 정류소 경로선(Polyline) 불러와 그리기
    async function loadRouteTrack(routeId) {
      routeLineGroup.clearLayers();

      try {
        const res = await fetch(`/api/bus/stations?routeId=${routeId}`);
        const data = await res.json();

        if (data.status === 'success' && data.stations && data.stations.length > 1) {
          const latLngs = data.stations.map(s => [s.lat, s.lng]);
          
          // 실제 도로 정류소들을 잇는 굴곡 노선선
          const polyline = L.polyline(latLngs, {
            color: getThemeColor(),
            weight: 5,
            opacity: 0.75,
            lineJoin: 'round'
          }).addTo(routeLineGroup);

          // 전체 노선 궤적이 한눈에 보이도록 지도 화면 자동 피팅
          map.fitBounds(polyline.getBounds(), { padding: [40, 40] });
        }
      } catch (err) {
        console.error('노선 정류소 수신 실패:', err);
      }
    }

    // 2. 실시간 버스 위치 수신 및 마커 표시
    async function updateBusPositions() {
      const apiUrl = `/api/bus/positions?routeId=${currentRouteId}`;

      try {
        const res = await fetch(apiUrl);
        const data = await res.json();

        if (data.status === 'success') {
          document.getElementById('bus-count').textContent = `운행 차량: ${data.count}대`;
          renderVehicles(data.vehicles);
        } else {
          document.getElementById('bus-count').textContent = '운행 차량: 0대';
          busLayerGroup.clearLayers();
        }
      } catch (err) {
        console.error('위치 데이터 수신 에러:', err);
      }
    }

    function renderVehicles(vehicles) {
      busLayerGroup.clearLayers();
      if (!vehicles || vehicles.length === 0) return;

      vehicles.forEach(bus => {
        const latLng = [bus.lat, bus.lng];
        const isUp = (bus.stopSeq % 2 === 1); 
        
        let colorClass = '';
        if (currentRouteType === 'express') colorClass = isUp ? 'express-up' : 'express-down';
        else if (currentRouteType === 'branch') colorClass = isUp ? 'branch-up' : 'branch-down';
        else colorClass = isUp ? 'trunk-up' : 'trunk-down';

        const dirLabel = isUp ? '▲ 상행' : '▼ 하행';
        const destDesc = isUp ? upDestText : downDestText;

        const busIcon = L.divIcon({
          className: 'custom-bus-icon',
          html: `
            <div class="bus-marker ${colorClass}">
              <span>🚌 ${currentRouteName}</span>
              <span class="dir-tag">${dirLabel}</span>
            </div>
          `,
          iconSize: [85, 26],
          iconAnchor: [42, 13]
        });

        const marker = L.marker(latLng, { icon: busIcon })
          .bindPopup(`
            <div style="font-size:12px; line-height:1.6;">
              <b style="font-size:13px; color:#1a73e8;">${currentRouteName}번 (${dirLabel})</b><br>
              <b>행선지:</b> ${destDesc}<br>
              <b>차량번호:</b> ${bus.plateNo}<br>
              <b>정류장 순번:</b> ${bus.stopSeq || '-'}<br>
              <b>업데이트:</b> ${new Date(bus.updatedAt).toLocaleTimeString()}
            </div>
          `);

        busLayerGroup.addLayer(marker);
      });
    }

    // 3. 노선 변경 시 실행
    function changeRoute(routeId) {
      const selector = document.getElementById('route-selector');
      const opt = selector.options[selector.selectedIndex];
      
      currentRouteId = routeId;
      currentRouteName = opt.getAttribute('data-name');
      currentRouteType = opt.getAttribute('data-type');
      upDestText = opt.getAttribute('data-up') || '상행';
      downDestText = opt.getAttribute('data-down') || '하행';

      updateLegend();
      document.getElementById('bus-count').textContent = '노선도 및 차량 조회 중...';
      
      // 새 노선 궤적선 로드 및 화면 맞춤
      loadRouteTrack(routeId);

      if (timerId) clearInterval(timerId);
      updateBusPositions();
      timerId = setInterval(updateBusPositions, 15000);
    }

    function updateLegend() {
      const upDot = document.getElementById('legend-up-dot');
      const downDot = document.getElementById('legend-down-dot');
      document.getElementById('legend-up-text').textContent = `상행 (${upDestText})`;
      document.getElementById('legend-down-text').textContent = `하행 (${downDestText})`;

      if (currentRouteType === 'express') {
        upDot.style.background = '#d9251b';
        downDot.style.background = '#ff6b6b';
      } else if (currentRouteType === 'branch') {
        upDot.style.background = '#28a745';
        downDot.style.background = '#8bc34a';
      } else {
        upDot.style.background = '#1a73e8';
        downDot.style.background = '#00bcd4';
      }
    }

    // 초기 실행
    updateLegend();
    loadRouteTrack(currentRouteId);
    updateBusPositions();
    timerId = setInterval(updateBusPositions, 15000);
  </script>
</body>
</html>
